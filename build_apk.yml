name: Rabie_First_APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_From_Zero
        run: |
          # صنع مجلدات المشروع
          mkdir -p my_app/src/main/java/com/rabie/cleanapp
          
          # ملف الإعدادات
          echo "include ':my_app'" > settings.gradle
          
          # ملف بناء التطبيق الأساسي
          cat <<EOF > my_app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android {
              namespace 'com.rabie.cleanapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.rabie.cleanapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # ملف المانيفست (هوية التطبيق)
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Rabie Clean App"><activity android:name="com.rabie.cleanapp.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > my_app/src/main/AndroidManifest.xml
          
          # كود الجافا (صفحة البداية)
          echo 'package com.rabie.cleanapp; import android.app.Activity; import android.os.Bundle; public class MainActivity extends Activity { @Override protected void onCreate(Bundle s) { super.onCreate(s); android.widget.TextView t = new android.widget.TextView(this); t.setText("Success! Rabie First APK ✅"); setContentView(t); } }' > my_app/src/main/java/com/rabie/cleanapp/MainActivity.java
          
          # تنفيذ البناء
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :my_app:assembleDebug --no-daemon

      - name: Upload_APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabie_Success_APK
          path: my_app/build/outputs/apk/debug/*.apk
