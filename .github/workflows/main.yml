name: Rabie_V15_Auto_Fixed
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_V15_Final
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          
          # إعداد المستودعات بشكل صحيح لتفادي Error 1000048564
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # واجهة V15 البسيطة والمحبوبة
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="horizontal" android:background="#0A0A1A">
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" 
                  android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:background="#16162E"/>
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" 
                  android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1.2" android:background="#0F0F1F"/>
              <androidx.media3.ui.PlayerView android:id="@+id/player_view" 
                  android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="2"/>
          </LinearLayout>
          EOF

          # كود الجافا مع إصلاح السطر 50 المشهور (Error 1000048573)
          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private RecyclerView rvG, rvI;
              private Map<String, List<String[]>> liveData = new LinkedHashMap<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  player = new ExoPlayer.Builder(this).build();
                  ((PlayerView)findViewById(R.id.player_view)).setPlayer(player);
                  rvG = findViewById(R.id.rv_groups); rvI = findViewById(R.id.rv_items);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));
                  
                  // تحميل القنوات تلقائياً عند التشغيل
                  loadChannels();
              }

              private void loadChannels() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> {
                      parseM3U(res);
                      rvG.setAdapter(new GroupAdapter(new ArrayList<>(liveData.keySet())));
                  }, null));
              }

              private void parseM3U(String content) {
                  String[] lines = content.split("\n"); String name="", group="General", link="";
                  for (String line : lines) {
                      if (line.contains("#EXTINF:")) {
                          name = line.split(",")[1].trim();
                          if(line.contains("group-title=\"")) group = line.split("group-title=\"")[1].split("\"")[0];
                      } else if (line.startsWith("http")) {
                          link = line.trim();
                          if(!liveData.containsKey(group)) liveData.put(group, new ArrayList<String[]>());
                          liveData.get(group).add(new String[]{name, link});
                      }
                  }
              }

              class GroupAdapter extends RecyclerView.Adapter<GroupAdapter.VH> {
                  List<String> keys; GroupAdapter(List<String> k){ keys=k; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { Button b=new Button(p.getContext()); b.setTextColor(-1); b.setBackgroundColor(0); return new VH(b); }
                  @Override public void onBindViewHolder(VH h, int i) { h.b.setText(keys.get(i)); h.b.setOnClickListener(v -> rvI.setAdapter(new ItemAdapter(liveData.get(keys.get(i))))); }
                  @Override public int getItemCount() { return keys.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v){ super(v); b=(Button)v; } }
              }

              class ItemAdapter extends RecyclerView.Adapter<ItemAdapter.VH> {
                  List<String[]> items; ItemAdapter(List<String[]> it){ items=it; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { TextView tv=new TextView(p.getContext()); tv.setTextColor(-1); tv.setPadding(20,30,20,30); return new VH(tv); }
                  @Override public void onBindViewHolder(VH h, int i) { h.tv.setText(items.get(i)[0]); h.tv.setOnClickListener(v -> { player.setMediaItem(MediaItem.fromUri(items.get(i)[1])); player.prepare(); player.play(); }); }
                  @Override public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView tv; VH(View v){ super(v); tv=(TextView)v; } }
              }
          }
          EOF

          # ملف Build.gradle المتوافق مع V15
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_V15_Fixed
        uses: actions/upload-artifact@v4
        with: { name: Rabie_V15_Final, path: app/build/outputs/apk/debug/*.apk }
