name: Rabie_Pro_V19_Premium_UI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_V19
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          cat <<EOF > app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config><base-config cleartextTrafficPermitted="true"/></network-security-config>
          EOF

          # تصميم الواجهة الرئيسية المطور
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" 
              android:background="#0a0714" android:keepScreenOn="true">
              
              <LinearLayout android:id="@+id/splash_screen" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0a0714" android:gravity="center" android:elevation="20dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO" android:textColor="#ff9100" android:textSize="50sp" android:textStyle="bold"/>
              </LinearLayout>

              <LinearLayout android:id="@+id/main_ui_container" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal" android:visibility="gone">
                  
                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.55" android:orientation="vertical" android:padding="10dp">
                      
                      <RelativeLayout android:layout_width="match_parent" android:layout_height="60dp" android:gravity="center_vertical" android:layout_marginBottom="5dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO" android:textColor="#ff9100" android:textStyle="bold" android:textSize="22sp" android:layout_alignParentLeft="true" android:layout_centerVertical="true"/>
                          <EditText android:id="@+id/search_bar" android:layout_width="180dp" android:layout_height="40dp" android:hint="🔍 بحث سريع..." android:textColor="#FFF" android:textColorHint="#777" android:background="@drawable/search_bg" android:paddingHorizontal="15dp" android:textSize="14sp" android:singleLine="true" android:layout_alignParentRight="true" android:layout_centerVertical="true"/>
                      </RelativeLayout>

                      <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.7">
                          <androidx.media3.ui.PlayerView android:id="@+id/small_player" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000" app:use_controller="false" app:resize_mode="fill"/>
                          <ProgressBar android:id="@+id/loading_s" android:layout_width="45dp" android:layout_height="45dp" android:layout_gravity="center" android:visibility="gone" android:indeterminateTint="#ff9100"/>
                      </FrameLayout>

                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="15dp" android:background="#140f24" android:orientation="vertical" android:layout_marginTop="5dp">
                          <TextView android:id="@+id/txt_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="اختر قناة للبدء" android:textColor="#ff9100" android:textSize="22sp" android:textStyle="bold" android:gravity="right"/>
                          <Button android:id="@+id/btn_toggle_fav" android:layout_width="wrap_content" android:layout_height="40dp" android:text="⭐ إضافة للمفضلة" android:textColor="#FFF" android:backgroundTint="#ff9100" android:layout_marginTop="10dp" android:layout_gravity="right" android:focusable="true" android:background="@drawable/focus_highlight"/>
                      </LinearLayout>
                  </LinearLayout>

                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.45" android:orientation="vertical" android:background="#0f0b1a">
                      
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="10dp" android:gravity="center">
                          <Button android:id="@+id/tab_fav" android:layout_width="45dp" android:layout_height="45dp" android:text="⭐" android:backgroundTint="#1c142e" android:focusable="true" android:background="@drawable/focus_highlight"/>
                          <Button android:id="@+id/tab_series" android:layout_width="0dp" android:layout_height="45dp" android:layout_weight="1" android:text="مسلسلات" android:textSize="13sp" android:backgroundTint="#1c142e" android:layout_marginLeft="5dp" android:focusable="true" android:background="@drawable/focus_highlight"/>
                          <Button android:id="@+id/tab_movie" android:layout_width="0dp" android:layout_height="45dp" android:layout_weight="1" android:text="أفلام" android:textSize="13sp" android:backgroundTint="#1c142e" android:layout_marginLeft="5dp" android:focusable="true" android:background="@drawable/focus_highlight"/>
                          <Button android:id="@+id/tab_live" android:layout_width="0dp" android:layout_height="45dp" android:layout_weight="1" android:text="قنوات" android:textSize="13sp" android:backgroundTint="#ff9100" android:layout_marginLeft="5dp" android:focusable="true" android:background="@drawable/focus_highlight"/>
                      </LinearLayout>

                      <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                          <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.6" android:background="#130d21"/>
                          <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.4" android:background="#1c142e"/>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>

              <FrameLayout android:id="@+id/full_container" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:background="#000">
                  <androidx.media3.ui.PlayerView android:id="@+id/full_player" android:layout_width="match_parent" android:layout_height="match_parent" app:resize_mode="fill" app:use_controller="false" />
                  <ProgressBar android:id="@+id/loading_f" android:layout_width="70dp" android:layout_height="70dp" android:layout_gravity="center" android:visibility="gone" android:indeterminateTint="#ff9100"/>
                  <RelativeLayout android:id="@+id/overlay_full" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#90000000" android:visibility="gone">
                      <TextView android:id="@+id/full_ch_name" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentTop="true" android:layout_centerHorizontal="true" android:layout_marginTop="30dp" android:textColor="#ff9100" android:textSize="24sp" android:textStyle="bold"/>
                      <LinearLayout android:id="@+id/vod_controls" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:layout_alignParentBottom="true" android:padding="40dp">
                          <SeekBar android:id="@+id/full_seekbar" android:layout_width="match_parent" android:layout_height="wrap_content" android:progressTint="#ff9100" android:thumbTint="#ff9100" android:focusable="true" android:splitTrack="false"/>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center" android:layout_marginTop="15dp">
                              <TextView android:id="@+id/txt_time" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="00:00 / 00:00" android:textColor="#FFF" android:textSize="16sp"/>
                              <Button android:id="@+id/btn_rew" android:layout_width="55dp" android:layout_height="55dp" android:text="⏪" android:backgroundTint="#221a36" android:layout_marginHorizontal="25dp" android:focusable="true" android:background="@drawable/focus_highlight"/>
                              <Button android:id="@+id/btn_play_pause" android:layout_width="65dp" android:layout_height="65dp" android:text="⏸" android:backgroundTint="#ff9100" android:focusable="true" android:background="@drawable/focus_highlight"/>
                              <Button android:id="@+id/btn_ffwd" android:layout_width="55dp" android:layout_height="55dp" android:text="⏩" android:backgroundTint="#221a36" android:layout_marginHorizontal="25dp" android:focusable="true" android:background="@drawable/focus_highlight"/>
                          </LinearLayout>
                      </LinearLayout>
                  </RelativeLayout>
              </FrameLayout>
          </RelativeLayout>
          EOF

          # تصاميم Drawable للأزرار والبحث
          cat <<EOF > app/src/main/res/drawable/search_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1c142e"/>
              <corners android:radius="20dp"/>
              <stroke android:width="1dp" android:color="#33ffffff"/>
          </shape>
          EOF

          cat <<EOF > app/src/main/res/drawable/focus_highlight.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true"><shape><solid android:color="#ff9100"/><corners android:radius="8dp"/></shape></item>
              <item><shape><solid android:color="@android:color/transparent"/><corners android:radius="8dp"/><stroke android:width="1dp" android:color="#22ffffff"/></shape></item>
          </selector>
          EOF

          cat <<EOF > app/src/main/res/layout/item_channel.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="horizontal" android:gravity="center_vertical" 
              android:padding="12dp" android:focusable="true" android:clickable="true"
              android:background="@drawable/focus_highlight" android:layout_margin="2dp">
              <TextView android:id="@+id/txt_name" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:textColor="#FFF" android:textSize="15sp" android:gravity="right" android:singleLine="true"/>
              <ImageView android:id="@+id/img_logo" android:layout_width="35dp" android:layout_height="35dp" android:layout_marginLeft="10dp" android:scaleType="centerInside"/>
          </LinearLayout>
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; versionCode 19; versionName "19.0" } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF

          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.*;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import com.bumptech.glide.Glide;
          import com.google.gson.Gson;
          import com.google.gson.reflect.TypeToken;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private Map<String, List<Ch>> live = new LinkedHashMap<>(), movie = new LinkedHashMap<>(), series = new LinkedHashMap<>();
              private List<Ch> favList = new ArrayList<>(), currentItems = new ArrayList<>();
              private Ch currentCh;
              private RecyclerView rvG, rvI;
              private TextView tTitle, tTime, tFullChName;
              private PlayerView smallPV, fullPV;
              private View mainUI, fullCont, overlay, vodControls, splash;
              private SeekBar seekBar;
              private Button btnPlayPause, tabLive, tabMovie, tabSeries, tabFav;
              private ProgressBar ps, pf;
              private String currentMode = "live";
              private Handler handler = new Handler();
              private long lastClickTime = 0;

              static class Ch { String n, u, g, l; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  hideSystemUI();

                  splash = findViewById(R.id.splash_screen);
                  mainUI = findViewById(R.id.main_ui_container);
                  handler.postDelayed(() -> { splash.setVisibility(View.GONE); mainUI.setVisibility(View.VISIBLE); }, 3000);

                  player = new ExoPlayer.Builder(this).build();
                  smallPV = findViewById(R.id.small_player); fullPV = findViewById(R.id.full_player);
                  fullCont = findViewById(R.id.full_container);
                  ps = findViewById(R.id.loading_s); pf = findViewById(R.id.loading_f);
                  overlay = findViewById(R.id.overlay_full); tTime = findViewById(R.id.txt_time); 
                  seekBar = findViewById(R.id.full_seekbar); btnPlayPause = findViewById(R.id.btn_play_pause);
                  tFullChName = findViewById(R.id.full_ch_name); vodControls = findViewById(R.id.vod_controls);
                  
                  tabLive = findViewById(R.id.tab_live); tabMovie = findViewById(R.id.tab_movie);
                  tabSeries = findViewById(R.id.tab_series); tabFav = findViewById(R.id.tab_fav);

                  smallPV.setPlayer(player);
                  player.addListener(new Player.Listener() {
                      @Override public void onPlaybackStateChanged(int state) {
                          int v = (state == Player.STATE_BUFFERING) ? View.VISIBLE : View.GONE;
                          ps.setVisibility(v); pf.setVisibility(v);
                      }
                      @Override public void onIsPlayingChanged(boolean isPlaying) {
                          btnPlayPause.setText(isPlaying ? "⏸" : "▶");
                      }
                  });

                  rvG = findViewById(R.id.rv_groups); rvI = findViewById(R.id.rv_items);
                  tTitle = findViewById(R.id.txt_title);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));

                  loadFavs(); loadData();

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override public void handleOnBackPressed() {
                          if (fullCont.getVisibility() == View.VISIBLE) toggleFull(false); else finish();
                      }
                  });

                  tabLive.setOnClickListener(v -> setMode("live"));
                  tabMovie.setOnClickListener(v -> setMode("movie"));
                  tabSeries.setOnClickListener(v -> setMode("series"));
                  tabFav.setOnClickListener(v -> setMode("fav"));
                  
                  findViewById(R.id.btn_toggle_fav).setOnClickListener(v -> toggleFav());
                  updateProgress();
              }

              private void setMode(String m) {
                  currentMode = m;
                  tabLive.setBackgroundTintList(android.content.res.ColorStateList.valueOf(m.equals("live") ? 0xffff9100 : 0xff1c142e));
                  tabMovie.setBackgroundTintList(android.content.res.ColorStateList.valueOf(m.equals("movie") ? 0xffff9100 : 0xff1c142e));
                  tabSeries.setBackgroundTintList(android.content.res.ColorStateList.valueOf(m.equals("series") ? 0xffff9100 : 0xff1c142e));
                  tabFav.setBackgroundTintList(android.content.res.ColorStateList.valueOf(m.equals("fav") ? 0xffff9100 : 0xff1c142e));

                  Map<String, List<Ch>> d = m.equals("movie") ? movie : (m.equals("series") ? series : live);
                  if (m.equals("fav")) { rvG.setAdapter(new GroupAdapter(Arrays.asList("المفضلة"), null)); rvI.setAdapter(new ItemAdapter(favList)); }
                  else {
                      List<String> groups = new ArrayList<>(d.keySet());
                      rvG.setAdapter(new GroupAdapter(groups, d));
                      if (!groups.isEmpty()) {
                          currentItems = d.get(groups.get(0));
                          rvI.setAdapter(new ItemAdapter(currentItems));
                      }
                  }
              }

              private void playChannel(Ch c) {
                  currentCh = c; tTitle.setText(c.n);
                  player.setMediaItem(MediaItem.fromUri(c.u)); player.prepare(); player.play();
              }

              private void toggleFull(boolean full) {
                  if (full) {
                      mainUI.setVisibility(View.GONE); fullCont.setVisibility(View.VISIBLE);
                      PlayerView.switchTargetView(player, smallPV, fullPV);
                  } else {
                      fullCont.setVisibility(View.GONE); mainUI.setVisibility(View.VISIBLE);
                      PlayerView.switchTargetView(player, fullPV, smallPV);
                  }
              }

              private void updateProgress() {
                  if (player != null && (currentMode.equals("movie") || currentMode.equals("series"))) {
                      long dur = player.getDuration(); long pos = player.getCurrentPosition();
                      if (dur > 0) { 
                          seekBar.setMax((int) dur); seekBar.setProgress((int) pos);
                          tTime.setText(formatTime(pos) + " / " + formatTime(dur)); 
                      }
                  }
                  handler.postDelayed(this::updateProgress, 1000);
              }

              private String formatTime(long ms) {
                  long s = (ms / 1000) % 60, m = (ms / 60000) % 60, h = (ms / 3600000);
                  return h > 0 ? String.format("%02d:%02d:%02d", h, m, s) : String.format("%02d:%02d", m, s);
              }

              private void hideSystemUI() { getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN); }
              private void loadData() { String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u"; Volley.newRequestQueue(this).add(new StringRequest(url, res -> { parse(res); setMode("live"); }, null)); }
              private void loadFavs() { String j = getSharedPreferences("p", MODE_PRIVATE).getString("f", "[]"); favList = new Gson().fromJson(j, new TypeToken<List<Ch>>(){}.getType()); }
              private void toggleFav() { if (currentCh == null) return; boolean exists = false; for (int i=0; i<favList.size(); i++) if(favList.get(i).u.equals(currentCh.u)) { favList.remove(i); exists=true; break; } if (!exists) favList.add(currentCh); getSharedPreferences("p", MODE_PRIVATE).edit().putString("f", new Gson().toJson(favList)).apply(); Toast.makeText(this, "تم التحديث", Toast.LENGTH_SHORT).show(); }
              private void parse(String text) { String[] lines = text.split("\n"); Ch cur = null; for (String l : lines) { if (l.contains("#EXTINF:")) { cur = new Ch(); cur.n = l.split(",").length > 1 ? l.split(",")[1].trim() : "Unknown"; cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "Other"; cur.l = l.contains("tvg-logo=\"") ? l.split("tvg-logo=\"")[1].split("\"")[0] : ""; } else if (l.startsWith("http") && cur != null) { cur.u = l.trim(); String g = cur.g.toLowerCase(); Map<String, List<Ch>> t = (g.contains("movie") || g.contains("افلام")) ? movie : (g.contains("series") || g.contains("مسلسل")) ? series : live; if (!t.containsKey(cur.g)) t.put(cur.g, new ArrayList<>()); t.get(cur.g).add(cur); cur = null; } } }

              class GroupAdapter extends RecyclerView.Adapter<GroupAdapter.VH> {
                  List<String> g; Map<String, List<Ch>> d;
                  GroupAdapter(List<String> g, Map<String, List<Ch>> d) { this.g = g; this.d = d; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { Button b = new Button(p.getContext()); b.setTextColor(-1); b.setAllCaps(false); b.setBackgroundResource(R.drawable.focus_highlight); b.setFocusable(true); return new VH(b); }
                  public void onBindViewHolder(VH h, int i) { h.b.setText(g.get(i)); h.b.setOnClickListener(v -> { if(d!=null) { currentItems = d.get(g.get(i)); rvI.setAdapter(new ItemAdapter(currentItems)); } }); }
                  public int getItemCount() { return g.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v) { super(v); b = (Button)v; } }
              }

              class ItemAdapter extends RecyclerView.Adapter<ItemAdapter.VH> {
                  List<Ch> items; ItemAdapter(List<Ch> i) { items = i; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { return new VH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_channel, p, false)); }
                  public void onBindViewHolder(VH h, int i) {
                      Ch c = items.get(i); h.n.setText(c.n); Glide.with(h.itemView).load(c.l).into(h.img);
                      h.itemView.setOnClickListener(v -> {
                          long time = System.currentTimeMillis();
                          if (time - lastClickTime < 400) toggleFull(true); else playChannel(c);
                          lastClickTime = time;
                      });
                  }
                  public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView n; ImageView img; VH(View v) { super(v); n = v.findViewById(R.id.txt_name); img = v.findViewById(R.id.img_logo); } }
              }
          }
          EOF

          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config" android:label="Rabie Pro V19" android:icon="@android:drawable/btn_star"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="orientation|screenSize"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_APK
        uses: actions/upload-artifact@v4
        with: { name: Rabie_Pro_V19_Premium, path: app/build/outputs/apk/debug/*.apk }
