name: Rabie_Pro_V17_Smart_Final
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_V17_Final
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; include ':app'" > settings.gradle

          mkdir -p app/src/main/java/com/rabie/iptv app/src/main/res/layout app/src/main/res/drawable app/src/main/res/xml

          # واجهة المستخدم (كل شيء في مكانه الصحيح)
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" 
              android:background="#0a0714" android:layoutDirection="rtl">
              
              <LinearLayout android:id="@+id/main_ui_container" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="55dp" android:background="#000" android:gravity="center_vertical" android:paddingHorizontal="15dp">
                      <EditText android:id="@+id/search_bar" android:layout_width="160dp" android:layout_height="35dp" android:hint="بحث..." android:textColor="#FFF" android:background="#1c142e" android:paddingHorizontal="10dp" android:textSize="13sp" android:fontFamily="sans-serif-light"/>
                      <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO" android:textColor="#ff9100" android:textSize="18sp" android:fontFamily="sans-serif-medium"/>
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.5" android:orientation="vertical">
                          <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.65">
                              <androidx.media3.ui.PlayerView android:id="@+id/small_player" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000" app:use_controller="false"/>
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO" android:textColor="#33ff9100" android:textSize="10sp" android:layout_margin="5dp" android:fontFamily="sans-serif-light"/>
                          </FrameLayout>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.35" android:padding="15dp" android:background="#130d21" android:orientation="vertical">
                              <TextView android:id="@+id/txt_title" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="اسم القناة" android:textColor="#ff9100" android:textSize="20sp" android:fontFamily="sans-serif-light"/>
                              <Button android:id="@+id/btn_fav" android:layout_width="wrap_content" android:layout_height="35dp" android:text="⭐ مفضلة" android:backgroundTint="#2d2445" android:layout_marginTop="10dp" android:textSize="10sp"/>
                          </LinearLayout>
                      </LinearLayout>

                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.28" android:background="#1a1429"/>

                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.22" android:orientation="vertical" android:background="#130d21">
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="5dp">
                              <Button android:id="@+id/tab_live" android:layout_width="match_parent" android:layout_height="35dp" android:text="القنوات" android:backgroundTint="#ff9100" android:textSize="11sp" android:layout_marginBottom="2dp"/>
                              <Button android:id="@+id/tab_movie" android:layout_width="match_parent" android:layout_height="35dp" android:text="الأفلام" android:backgroundTint="#1c142e" android:textSize="11sp" android:layout_marginBottom="2dp"/>
                              <Button android:id="@+id/tab_series" android:layout_width="match_parent" android:layout_height="35dp" android:text="المسلسلات" android:backgroundTint="#1c142e" android:textSize="11sp"/>
                          </LinearLayout>
                          <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#1c142e"/>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>

              <FrameLayout android:id="@+id/full_container" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:background="#000">
                  <androidx.media3.ui.PlayerView android:id="@+id/full_player" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="false" />
                  <RelativeLayout android:id="@+id/vod_overlay" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#90000000" android:visibility="gone">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:layout_alignParentBottom="true" android:padding="30dp">
                          <SeekBar android:id="@+id/vod_seekbar" android:layout_width="match_parent" android:layout_height="wrap_content" android:progressTint="#ff9100" android:thumbTint="#ff9100"/>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center" android:layout_marginTop="10dp">
                              <Button android:id="@+id/btn_rew" android:layout_width="50dp" android:layout_height="50dp" android:text="⏪" android:background="?android:attr/selectableItemBackground"/>
                              <Button android:id="@+id/btn_play" android:layout_width="60dp" android:layout_height="60dp" android:text="⏸" android:textSize="20sp" android:background="?android:attr/selectableItemBackground"/>
                              <Button android:id="@+id/btn_ff" android:layout_width="50dp" android:layout_height="50dp" android:text="⏩" android:background="?android:attr/selectableItemBackground"/>
                          </LinearLayout>
                      </LinearLayout>
                  </RelativeLayout>
              </FrameLayout>
          </RelativeLayout>
          EOF

          cat <<EOF > app/src/main/res/layout/item_channel.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:padding="12dp" android:gravity="center_vertical" android:background="?android:attr/selectableItemBackground">
              <ImageView android:id="@+id/img_logo" android:layout_width="32dp" android:layout_height="32dp" android:layout_marginLeft="12dp"/>
              <TextView android:id="@+id/txt_name" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFF" android:textSize="14sp" android:fontFamily="sans-serif-light"/>
          </LinearLayout>
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; versionCode 17; versionName "17.0" } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF

          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.*;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import com.bumptech.glide.Glide;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private Map<String, List<Ch>> live = new LinkedHashMap<>(), movie = new LinkedHashMap<>(), series = new LinkedHashMap<>();
              private RecyclerView rvG, rvI;
              private View mainUI, fullCont, vodOverlay;
              private SeekBar seekBar;
              private String currentMode = "live";
              private Handler handler = new Handler();

              static class Ch { String n, u, g, l; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  player = new ExoPlayer.Builder(this).build();
                  ((PlayerView)findViewById(R.id.small_player)).setPlayer(player);
                  ((PlayerView)findViewById(R.id.full_player)).setPlayer(player);
                  
                  mainUI = findViewById(R.id.main_ui_container);
                  fullCont = findViewById(R.id.full_container);
                  vodOverlay = findViewById(R.id.vod_overlay);
                  seekBar = findViewById(R.id.vod_seekbar);

                  rvG = findViewById(R.id.rv_groups); rvI = findViewById(R.id.rv_items);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));

                  loadData();
                  setupVOD();

                  findViewById(R.id.tab_live).setOnClickListener(v -> setMode("live"));
                  findViewById(R.id.tab_movie).setOnClickListener(v -> setMode("movie"));
                  findViewById(R.id.tab_series).setOnClickListener(v -> setMode("series"));
              }

              private void setupVOD() {
                  findViewById(R.id.btn_rew).setOnClickListener(v -> player.seekTo(player.getCurrentPosition() - 10000));
                  findViewById(R.id.btn_ff).setOnClickListener(v -> player.seekTo(player.getCurrentPosition() + 10000));
                  findViewById(R.id.btn_play).setOnClickListener(v -> {
                      if (player.isPlaying()) { player.pause(); ((Button)v).setText("▶"); }
                      else { player.play(); ((Button)v).setText("⏸"); }
                  });
                  updateProg();
              }

              private void updateProg() {
                  if (player != null && (currentMode.equals("movie") || currentMode.equals("series"))) {
                      seekBar.setMax((int)player.getDuration());
                      seekBar.setProgress((int)player.getCurrentPosition());
                  }
                  handler.postDelayed(this::updateProg, 1000);
              }

              @Override
              public void onBackPressed() {
                  if (fullCont.getVisibility() == View.VISIBLE) {
                      fullCont.setVisibility(View.GONE);
                      mainUI.setVisibility(View.VISIBLE);
                      vodOverlay.setVisibility(View.GONE);
                  } else super.onBackPressed();
              }

              private void setMode(String m) {
                  currentMode = m;
                  Map<String, List<Ch>> d = m.equals("movie") ? movie : (m.equals("series") ? series : live);
                  rvG.setAdapter(new GAdapter(new ArrayList<>(d.keySet()), d));
              }

              private void loadData() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> { parse(res); setMode("live"); }, null));
              }

              private void parse(String text) {
                  String[] lines = text.split("\n"); Ch cur = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          cur = new Ch(); cur.n = l.split(",").length > 1 ? l.split(",")[1].trim() : "";
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "General";
                          cur.l = l.contains("tvg-logo=\"") ? l.split("tvg-logo=\"")[1].split("\"")[0] : "";
                      } else if (l.startsWith("http") && cur != null) {
                          cur.u = l.trim(); String g = cur.g.toLowerCase();
                          Map<String, List<Ch>> t = (g.contains("movie") || g.contains("افلام")) ? movie : (g.contains("series") || g.contains("مسلسل")) ? series : live;
                          if (!t.containsKey(cur.g)) t.put(cur.g, new ArrayList<>());
                          t.get(cur.g).add(cur); cur = null;
                      }
                  }
              }

              class GAdapter extends RecyclerView.Adapter<RecyclerView.ViewHolder> {
                  List<String> groups; Map<String, List<Ch>> data;
                  GAdapter(List<String> g, Map<String, List<Ch>> d) { groups = g; data = d; }
                  public RecyclerView.ViewHolder onCreateViewHolder(ViewGroup p, int t) {
                      TextView tv = new TextView(p.getContext()); tv.setTextColor(-1); tv.setPadding(30,25,30,25);
                      tv.setFocusable(true); tv.setBackgroundResource(android.R.drawable.list_selector_background);
                      return new RecyclerView.ViewHolder(tv){};
                  }
                  public void onBindViewHolder(RecyclerView.ViewHolder h, int i) {
                      ((TextView)h.itemView).setText(groups.get(i));
                      h.itemView.setOnClickListener(v -> rvI.setAdapter(new IAdapter(data.get(groups.get(i)))));
                  }
                  public int getItemCount() { return groups.size(); }
              }

              class IAdapter extends RecyclerView.Adapter<RecyclerView.ViewHolder> {
                  List<Ch> items; IAdapter(List<Ch> i) { items = i; }
                  public RecyclerView.ViewHolder onCreateViewHolder(ViewGroup p, int t) {
                      return new RecyclerView.ViewHolder(LayoutInflater.from(p.getContext()).inflate(R.layout.item_channel, p, false)){};
                  }
                  public void onBindViewHolder(RecyclerView.ViewHolder h, int i) {
                      Ch c = items.get(i); ((TextView)h.itemView.findViewById(R.id.txt_name)).setText(c.n);
                      Glide.with(h.itemView).load(c.l).into((ImageView)h.itemView.findViewById(R.id.img_logo));
                      h.itemView.setOnClickListener(v -> {
                          player.setMediaItem(MediaItem.fromUri(c.u)); player.prepare(); player.play();
                          ((TextView)findViewById(R.id.txt_title)).setText(c.n);
                      });
                      h.itemView.setOnLongClickListener(v -> {
                          mainUI.setVisibility(View.GONE); fullCont.setVisibility(View.VISIBLE);
                          if (!currentMode.equals("live")) vodOverlay.setVisibility(View.VISIBLE);
                          return true;
                      });
                  }
                  public int getItemCount() { return items.size(); }
              }
          }
          EOF

          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:label="Rabie Pro V17 Final"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Final_Upload
        uses: actions/upload-artifact@v4
        with: { name: Rabie_Pro_V17_Final_Fix, path: app/build/outputs/apk/debug/*.apk }
