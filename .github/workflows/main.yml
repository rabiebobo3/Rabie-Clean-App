name: Rabie_Original_Exo_V31
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Pure_ExoPlayer
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # ألوان الواجهة
          cat <<EOF > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#000000</color>
              <color name="ibo_orange">#ff9100</color>
              <color name="dark_bg">#0a0714</color>
          </resources>
          EOF

          # تصميم الكارد (بوستر الأفلام)
          cat <<EOF > app/src/main/res/layout/item_card.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="vertical" android:padding="4dp" android:gravity="center">
              <ImageView android:id="@+id/img_logo" android:layout_width="110dp" android:layout_height="160dp"
                  android:scaleType="centerCrop" android:background="#222"/>
              <TextView android:id="@+id/txt_name" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:textColor="#FFF" android:textSize="9sp" android:gravity="center" android:lines="1"/>
          </LinearLayout>
          EOF

          # الواجهة الرئيسية (القنوات + البحث + المشغل)
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0a0714">
              
              <LinearLayout android:id="@+id/main_layout" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="50dp" android:background="#000" android:gravity="center_vertical" android:padding="5dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE TV" android:textColor="#ff9100" android:textStyle="bold"/>
                      <EditText android:id="@+id/search_bar" android:layout_width="150dp" android:layout_height="35dp" android:layout_marginLeft="10dp" android:hint="بحث..." android:background="#222" android:textColor="#FFF" android:paddingLeft="10dp" android:textSize="12sp"/>
                      <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                      <Button android:id="@+id/btn_live" android:layout_width="wrap_content" android:layout_height="35dp" android:text="LIVE" android:textSize="8sp"/>
                      <Button android:id="@+id/btn_vod" android:layout_width="wrap_content" android:layout_height="35dp" android:text="VOD" android:textSize="8sp" android:layout_marginLeft="5dp"/>
                  </LinearLayout>

                  <LinearLayout android:id="@+id/live_section" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.3" android:background="#1c142e"/>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.3" android:background="#130d21"/>
                      <com.google.android.exoplayer2.ui.PlayerView android:id="@+id/small_player" android:layout_width="0dp" android:layout_height="250dp" android:layout_weight="0.4" xmlns:app="http://schemas.android.com/apk/res-auto" app:use_controller="false"/>
                  </LinearLayout>

                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_grid" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:padding="5dp"/>
              </LinearLayout>

              <com.google.android.exoplayer2.ui.PlayerView android:id="@+id/full_player" android:layout_width="match_parent" android:layout_height="match_parent"
                  android:visibility="gone" android:background="#000" xmlns:app="http://schemas.android.com/apk/res-auto" app:resize_mode="fill" app:use_controller="true"/>
          </RelativeLayout>
          EOF

          # كود الجافا باستعمال ExoPlayer 2.19.1
          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.*;
          import com.google.android.exoplayer2.*;
          import com.google.android.exoplayer2.ui.PlayerView;
          import com.android.volley.toolbox.*;
          import com.bumptech.glide.Glide;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private PlayerView pvSmall, pvFull;
              private View mainLayout, liveSection;
              private RecyclerView rvG, rvI, rvGrid;
              private Map<String, List<Ch>> liveData = new LinkedHashMap<>(), vodData = new LinkedHashMap<>();
              class Ch { String n, u, l, g; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  player = new ExoPlayer.Builder(this).build();
                  pvSmall = findViewById(R.id.small_player); pvFull = findViewById(R.id.full_player);
                  mainLayout = findViewById(R.id.main_layout); liveSection = findViewById(R.id.live_section);
                  rvG = findViewById(R.id.rv_groups); rvI = findViewById(R.id.rv_items); rvGrid = findViewById(R.id.rv_grid);
                  
                  pvSmall.setPlayer(player); pvFull.setPlayer(player);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));
                  rvGrid.setLayoutManager(new GridLayoutManager(this, 5));

                  fetchM3u();
                  findViewById(R.id.btn_live).setOnClickListener(v -> { liveSection.setVisibility(View.VISIBLE); rvGrid.setVisibility(View.GONE); });
                  findViewById(R.id.btn_vod).setOnClickListener(v -> showVod());
                  
                  // Double Tap للتكبير
                  pvSmall.setOnTouchListener(new View.OnTouchListener() {
                      private GestureDetector gd = new GestureDetector(MainActivity.this, new GestureDetector.SimpleOnGestureListener() {
                          @Override public boolean onDoubleTap(MotionEvent e) { goFull(true); return true; }
                      });
                      @Override public boolean onTouch(View v, MotionEvent ev) { return gd.onTouchEvent(ev); }
                  });
              }

              private void goFull(boolean full) {
                  pvFull.setVisibility(full ? View.VISIBLE : View.GONE);
                  mainLayout.setVisibility(full ? View.GONE : View.VISIBLE);
              }

              private void fetchM3u() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> {
                      parse(res);
                      rvG.setAdapter(new GAdapter(new ArrayList<>(liveData.keySet())));
                  }, null));
              }

              private void parse(String text) {
                  String[] lines = text.split("\n"); Ch cur = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          cur = new Ch();
                          cur.n = l.split(",")[1].trim();
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "General";
                          cur.l = l.contains("tvg-logo=\"") ? l.split("tvg-logo=\"")[1].split("\"")[0] : "";
                      } else if (l.startsWith("http") && cur != null) {
                          cur.u = l.trim();
                          if (cur.g.toLowerCase().contains("movie") || cur.g.toLowerCase().contains("series"))
                              vodData.computeIfAbsent(cur.g, k -> new ArrayList<>()).add(cur);
                          else liveData.computeIfAbsent(cur.g, k -> new ArrayList<>()).add(cur);
                          cur = null;
                      }
                  }
              }

              private void showVod() {
                  liveSection.setVisibility(View.GONE); rvGrid.setVisibility(View.VISIBLE);
                  List<Ch> allVod = new ArrayList<>(); for(List<Ch> list : vodData.values()) allVod.addAll(list);
                  rvGrid.setAdapter(new CardAdapter(allVod));
              }

              @Override public void onBackPressed() { if (pvFull.getVisibility() == View.VISIBLE) goFull(false); else super.onBackPressed(); }

              class GAdapter extends RecyclerView.Adapter<GAdapter.VH> {
                  List<String> d; GAdapter(List<String> d) { this.d = d; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { Button b = new Button(p.getContext()); b.setTextColor(-1); b.setBackgroundColor(0); return new VH(b); }
                  @Override public void onBindViewHolder(VH h, int i) { h.b.setText(d.get(i)); h.b.setOnClickListener(v -> rvI.setAdapter(new IAdapter(liveData.get(d.get(i))))); }
                  @Override public int getItemCount() { return d.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v) { super(v); b = (Button)v; } }
              }

              class IAdapter extends RecyclerView.Adapter<IAdapter.VH> {
                  List<Ch> items; IAdapter(List<Ch> i) { items = i; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { TextView tv = new TextView(p.getContext()); tv.setPadding(20,20,20,20); tv.setTextColor(-1); return new VH(tv); }
                  @Override public void onBindViewHolder(VH h, int i) {
                      h.tv.setText(items.get(i).n);
                      h.tv.setOnClickListener(v -> { player.setMediaItem(MediaItem.fromUri(items.get(i).u)); player.prepare(); player.play(); });
                  }
                  @Override public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView tv; VH(View v) { super(v); tv = (TextView)v; } }
              }

              class CardAdapter extends RecyclerView.Adapter<CardAdapter.VH> {
                  List<Ch> items; CardAdapter(List<Ch> i) { items = i; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { View v = LayoutInflater.from(p.getContext()).inflate(R.layout.item_card, p, false); return new VH(v); }
                  @Override public void onBindViewHolder(VH h, int i) {
                      Ch c = items.get(i); h.name.setText(c.n);
                      Glide.with(MainActivity.this).load(c.l).into(h.img);
                      h.itemView.setOnClickListener(v -> { goFull(true); player.setMediaItem(MediaItem.fromUri(c.u)); player.prepare(); player.play(); });
                  }
                  @Override public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { ImageView img; TextView name; VH(View v) { super(v); img=v.findViewById(R.id.img_logo); name=v.findViewById(R.id.txt_name); } }
              }
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:label="Rabie Original Exo"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_V31
        uses: actions/upload-artifact@v4
        with: { name: Rabie_ExoPlayer_V31, path: app/build/outputs/apk/debug/*.apk }
