name: Rabie_Royal_V34
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Royal_Edition
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # ألوان "الذهبي الملكي"
          cat <<EOF > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#000000</color>
              <color name="gold">#FFD700</color>
              <color name="dark_purple">#0a0714</color>
              <color name="gray_bg">#1A1A1A</color>
          </resources>
          EOF

          # تصميم كارد الأفلام (اللوقو والاسم)
          cat <<EOF > app/src/main/res/layout/item_card.xml
          <androidx.cardview.widget.CardView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="110dp" android:layout_height="160dp" android:layout_margin="5dp"
              app:cardBackgroundColor="#1A1A1A" app:cardCornerRadius="10dp">
              <RelativeLayout android:layout_width="match_parent" android:layout_height="match_parent">
                  <ImageView android:id="@+id/img_logo" android:layout_width="match_parent" android:layout_height="match_parent" android:scaleType="centerCrop"/>
                  <TextView android:id="@+id/txt_name" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:layout_alignParentBottom="true" android:background="#CC000000"
                      android:textColor="#FFD700" android:textSize="10sp" android:gravity="center" android:padding="4dp"/>
              </RelativeLayout>
          </androidx.cardview.widget.CardView>
          EOF

          # الواجهة الاحترافية (البحث + الأقسام + المشغل + الساعة)
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0a0714">
              
              <LinearLayout android:id="@+id/main_content" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="55dp" android:background="#000" android:gravity="center_vertical" android:padding="10dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE GOLD" android:textColor="#FFD700" android:textStyle="bold" android:textSize="18sp"/>
                      <EditText android:id="@+id/et_search" android:layout_width="200dp" android:layout_height="35dp" android:layout_marginLeft="20dp" android:hint="بحث سريع..." android:textColor="#FFF" android:background="#1c142e" android:paddingLeft="12dp" android:textSize="12sp"/>
                      <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                      <TextView android:id="@+id/txt_time" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFD700" android:textSize="12sp" android:layout_marginRight="10dp"/>
                  </LinearLayout>

                  <FrameLayout android:layout_width="match_parent" android:layout_height="match_parent">
                      <LinearLayout android:id="@+id/lay_live" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                          <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.25" android:background="#1c142e"/>
                          <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.3" android:background="#130d21"/>
                          <com.google.android.exoplayer2.ui.PlayerView android:id="@+id/pv_small" android:layout_width="0dp" android:layout_height="280dp" android:layout_weight="0.45" xmlns:app="http://schemas.android.com/apk/res-auto" app:use_controller="false" app:resize_mode="fill"/>
                      </LinearLayout>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_grid" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:padding="8dp"/>
                  </FrameLayout>
              </LinearLayout>

              <com.google.android.exoplayer2.ui.PlayerView android:id="@+id/pv_full" android:layout_width="match_parent" android:layout_height="match_parent"
                  android:visibility="gone" android:background="#000" xmlns:app="http://schemas.android.com/apk/res-auto" app:resize_mode="fill" app:use_controller="true"/>
          </RelativeLayout>
          EOF

          # كود الجافا (نظام إيبو بلاير مع السيرفر)
          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.*;
          import android.text.*;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.*;
          import com.google.android.exoplayer2.*;
          import com.google.android.exoplayer2.ui.PlayerView;
          import com.android.volley.toolbox.*;
          import com.bumptech.glide.Glide;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private PlayerView pvSmall, pvFull;
              private View mainContent, layLive;
              private RecyclerView rvG, rvI, rvGrid;
              private Map<String, List<Ch>> live = new LinkedHashMap<>(), vod = new LinkedHashMap<>();
              class Ch { String n, u, l, g; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  player = new ExoPlayer.Builder(this).build();
                  pvSmall = findViewById(R.id.pv_small); pvFull = findViewById(R.id.pv_full);
                  mainContent = findViewById(R.id.main_content); layLive = findViewById(R.id.lay_live);
                  rvG = findViewById(R.id.rv_groups); rvI = findViewById(R.id.rv_items); rvGrid = findViewById(R.id.rv_grid);
                  
                  pvSmall.setPlayer(player); pvFull.setPlayer(player);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));
                  rvGrid.setLayoutManager(new GridLayoutManager(this, 5));

                  startClock();
                  loadData();

                  // نظام التكبير بلمستين
                  pvSmall.setOnTouchListener((v, ev) -> {
                      GestureDetector gd = new GestureDetector(this, new GestureDetector.SimpleOnGestureListener() {
                          @Override public boolean onDoubleTap(MotionEvent e) { toggleFull(true); return true; }
                      });
                      return gd.onTouchEvent(ev);
                  });
              }

              private void startClock() {
                  Handler h = new Handler(Looper.getMainLooper());
                  h.post(new Runnable() {
                      @Override public void run() {
                          String t = new SimpleDateFormat("HH:mm", Locale.getDefault()).format(new Date());
                          ((TextView)findViewById(R.id.txt_time)).setText(t);
                          h.postDelayed(this, 60000);
                      }
                  });
              }

              private void loadData() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> {
                      parse(res);
                      rvG.setAdapter(new GAdapter(new ArrayList<>(live.keySet())));
                  }, null));
              }

              private void parse(String text) {
                  String[] lines = text.split("\n"); Ch cur = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          cur = new Ch();
                          cur.n = l.split(",")[1].trim();
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "General";
                          cur.l = l.contains("tvg-logo=\"") ? l.split("tvg-logo=\"")[1].split("\"")[0] : "";
                      } else if (l.startsWith("http") && cur != null) {
                          cur.u = l.trim();
                          if (cur.g.toLowerCase().contains("movie") || cur.g.toLowerCase().contains("series"))
                               vod.computeIfAbsent(cur.g, k -> new ArrayList<>()).add(cur);
                          else live.computeIfAbsent(cur.g, k -> new ArrayList<>()).add(cur);
                          cur = null;
                      }
                  }
              }

              private void toggleFull(boolean full) {
                  pvFull.setVisibility(full ? View.VISIBLE : View.GONE);
                  mainContent.setVisibility(full ? View.GONE : View.VISIBLE);
              }

              @Override public void onBackPressed() {
                  if (pvFull.getVisibility() == View.VISIBLE) toggleFull(false);
                  else if (rvGrid.getVisibility() == View.VISIBLE) { rvGrid.setVisibility(View.GONE); layLive.setVisibility(View.VISIBLE); }
                  else super.onBackPressed();
              }

              class GAdapter extends RecyclerView.Adapter<GAdapter.VH> {
                  List<String> d; GAdapter(List<String> d) { this.d = d; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { Button b = new Button(p.getContext()); b.setTextColor(-1); b.setBackgroundColor(0); return new VH(b); }
                  @Override public void onBindViewHolder(VH h, int i) { h.b.setText(d.get(i)); h.b.setOnClickListener(v -> rvI.setAdapter(new IAdapter(live.get(d.get(i))))); }
                  @Override public int getItemCount() { return d.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v) { super(v); b = (Button)v; } }
              }

              class IAdapter extends RecyclerView.Adapter<IAdapter.VH> {
                  List<Ch> items; IAdapter(List<Ch> i) { items = i; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { TextView tv = new TextView(p.getContext()); tv.setPadding(20,20,20,20); tv.setTextColor(-1); return new VH(tv); }
                  @Override public void onBindViewHolder(VH h, int i) {
                      h.tv.setText(items.get(i).n);
                      h.tv.setOnClickListener(v -> { player.setMediaItem(MediaItem.fromUri(items.get(i).u)); player.prepare(); player.play(); });
                  }
                  @Override public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView tv; VH(View v) { super(v); tv = (TextView)v; } }
              }

              class CardAdapter extends RecyclerView.Adapter<CardAdapter.VH> {
                  List<Ch> items; CardAdapter(List<Ch> i) { items = i; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { View v = LayoutInflater.from(p.getContext()).inflate(R.layout.item_card, p, false); return new VH(v); }
                  @Override public void onBindViewHolder(VH h, int i) {
                      Ch c = items.get(i); h.name.setText(c.n);
                      Glide.with(MainActivity.this).load(c.l).placeholder(android.R.drawable.ic_menu_gallery).into(h.img);
                      h.itemView.setOnClickListener(v -> { toggleFull(true); player.setMediaItem(MediaItem.fromUri(c.u)); player.prepare(); player.play(); });
                  }
                  @Override public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { ImageView img; TextView name; VH(View v) { super(v); img=v.findViewById(R.id.img_logo); name=v.findViewById(R.id.txt_name); } }
              }
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0"; } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:label="Rabie Royal TV"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_V34
        uses: actions/upload-artifact@v4
        with: { name: Rabie_Royal_V34, path: app/build/outputs/apk/debug/*.apk }
