name: Rabie_Pro_V35_Ultimate_Fix
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Fix_Final
        run: |
          # تنظيف شامل للمجلدات لضمان عدم تكرار الأخطاء
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          # بناء هيكل المجلدات من جديد
          mkdir -p app/src/main/java/com/rabie/iptv app/src/main/res/layout app/src/main/res/drawable app/src/main/res/xml
          
          # إعدادات الحماية والنت
          echo '<?xml version="1.0" encoding="utf-8"?><network-security-config><base-config cleartextTrafficPermitted="true"/></network-security-config>' > app/src/main/res/xml/network_security_config.xml

          # واجهة المستخدم الأصلية تاعك (الزرار في مكانهم)
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" 
              android:background="#0a0714" android:keepScreenOn="true">
              
              <LinearLayout android:id="@+id/splash_screen" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0a0714" android:gravity="center" android:elevation="20dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO" android:textColor="#ff9100" android:textSize="50sp" android:textStyle="bold"/>
              </LinearLayout>

              <LinearLayout android:id="@+id/main_ui_container" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="#000" android:gravity="center_vertical" android:padding="8dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO" android:textColor="#ff9100" android:textStyle="bold" android:textSize="18sp"/>
                      <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                      <Button android:id="@+id/tab_live" android:layout_width="wrap_content" android:layout_height="38dp" android:text="القنوات" android:textColor="#CCC" android:background="@drawable/tab_button_style" android:layout_margin="2dp" android:focusable="true"/>
                      <Button android:id="@+id/tab_movie" android:layout_width="wrap_content" android:layout_height="38dp" android:text="الأفلام" android:textColor="#CCC" android:background="@drawable/tab_button_style" android:layout_margin="2dp" android:focusable="true"/>
                      <Button android:id="@+id/tab_series" android:layout_width="wrap_content" android:layout_height="38dp" android:text="المسلسلات" android:textColor="#CCC" android:background="@drawable/tab_button_style" android:layout_margin="2dp" android:focusable="true"/>
                      <Button android:id="@+id/tab_fav" android:layout_width="45dp" android:layout_height="38dp" android:text="⭐" android:textColor="#ff9100" android:background="@drawable/tab_button_style" android:focusable="true"/>
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.5" android:orientation="vertical">
                          <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.7">
                              <androidx.media3.ui.PlayerView android:id="@+id/small_player" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="false"/>
                              <ProgressBar android:id="@+id/loading_s" android:layout_width="50dp" android:layout_height="50dp" android:layout_gravity="center" android:visibility="gone" android:indeterminateTint="#ff9100"/>
                          </FrameLayout>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.3" android:padding="10dp" android:background="#1c142e" android:orientation="vertical">
                              <TextView android:id="@+id/txt_title" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="إختر قناة" android:textColor="#FFF" android:textSize="16sp"/>
                              <Button android:id="@+id/btn_toggle_fav" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="إضافة للمفضلة" android:layout_marginTop="5dp" android:focusable="true"/>
                          </LinearLayout>
                      </LinearLayout>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.3" android:background="#130d21"/>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.2" android:background="#1c142e"/>
                  </LinearLayout>
              </LinearLayout>

              <FrameLayout android:id="@+id/full_container" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:background="#000">
                  <androidx.media3.ui.PlayerView android:id="@+id/full_player" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="false"/>
                  <ProgressBar android:id="@+id/loading_f" android:layout_width="80dp" android:layout_height="80dp" android:layout_gravity="center" android:visibility="gone" android:indeterminateTint="#ff9100"/>
              </FrameLayout>
          </RelativeLayout>
          EOF

          # ملف الـ Build بصيغة صحيحة (حل مشكلة عدم إيجاد gson)
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android { 
              namespace 'com.rabie.iptv'
              compileSdk 34
              defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; versionCode 35; versionName "35.0" }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF

          # الكود البرمجي (تم تصحيح الأخطاء اللي شفتها في الصورة)
          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.*;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.*;
          import com.android.volley.toolbox.*;
          import com.google.gson.Gson;
          import com.google.gson.reflect.TypeToken;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private Map<String, List<Ch>> live = new LinkedHashMap<>(), movie = new LinkedHashMap<>();
              private Map<String, Map<String, List<Ch>>> series = new LinkedHashMap<>();
              private List<Ch> favList = new ArrayList<>(), currentItems = new ArrayList<>();
              private Ch currentCh;
              private RecyclerView rvG, rvI;
              private TextView tTitle;
              private PlayerView smallPV, fullPV;
              private View mainUI, fullCont, splash;
              private ProgressBar ps, pf;
              private Handler handler = new Handler(Looper.getMainLooper());
              private long lastPos = -1;

              static class Ch { String n, u, g, l; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  splash = findViewById(R.id.splash_screen); mainUI = findViewById(R.id.main_ui_container);
                  smallPV = findViewById(R.id.small_player); fullPV = findViewById(R.id.full_player);
                  fullCont = findViewById(R.id.full_container);
                  ps = findViewById(R.id.loading_s); pf = findViewById(R.id.loading_f);
                  tTitle = findViewById(R.id.txt_title);
                  rvG = findViewById(R.id.rv_groups); rvI = findViewById(R.id.rv_items);

                  handler.postDelayed(() -> { splash.setVisibility(View.GONE); mainUI.setVisibility(View.VISIBLE); }, 2000);

                  // بفر 20 ثانية لمنع التجمد كما طلبت
                  DefaultLoadControl lc = new DefaultLoadControl.Builder()
                      .setBufferDurationsMs(20000, 50000, 2500, 5000).build();
                  player = new ExoPlayer.Builder(this).setLoadControl(lc).build();
                  smallPV.setPlayer(player);

                  player.addListener(new Player.Listener() {
                      public void onPlaybackStateChanged(int s) {
                          int v = (s == Player.STATE_BUFFERING) ? View.VISIBLE : View.GONE;
                          ps.setVisibility(v); pf.setVisibility(v);
                      }
                  });

                  // مراقب التجمد: يظهر عجلة التحميل سيفيف
                  handler.post(new Runnable() {
                      public void run() {
                          if (player.isPlaying()) {
                              long cur = player.getCurrentPosition();
                              if (cur == lastPos) { ps.setVisibility(View.VISIBLE); pf.setVisibility(View.VISIBLE); }
                              else if (player.getPlaybackState() != Player.STATE_BUFFERING) { ps.setVisibility(View.GONE); pf.setVisibility(View.GONE); }
                              lastPos = cur;
                          }
                          handler.postDelayed(this, 1500);
                      }
                  });

                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));

                  loadData();
                  
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      public void handleOnBackPressed() { 
                          if (fullCont.getVisibility() == View.VISIBLE) toggleFull(false); else finish();
                      }
                  });

                  findViewById(R.id.tab_live).setOnClickListener(v -> setMode("live"));
                  findViewById(R.id.tab_movie).setOnClickListener(v -> setMode("movie"));
                  findViewById(R.id.tab_series).setOnClickListener(v -> setMode("series"));
              }

              private void toggleFull(boolean full) {
                  if (full) {
                      mainUI.setVisibility(View.GONE); fullCont.setVisibility(View.VISIBLE);
                      PlayerView.switchTargetView(player, smallPV, fullPV);
                  } else {
                      fullCont.setVisibility(View.GONE); mainUI.setVisibility(View.VISIBLE);
                      PlayerView.switchTargetView(player, fullPV, smallPV);
                      // يرجع للقناة مباشرة في المشغل الصغير
                  }
              }

              private void setMode(String m) {
                  Map<String, List<Ch>> d = m.equals("movie") ? movie : live;
                  if (d != null && !d.isEmpty()) {
                      List<String> gList = new ArrayList<>(d.keySet());
                      rvG.setAdapter(new GroupAdapter(gList, d));
                  }
              }

              class GroupAdapter extends RecyclerView.Adapter<GroupAdapter.VH> {
                  List<String> g; Map<String, List<Ch>> d;
                  GroupAdapter(List<String> g, Map<String, List<Ch>> d) { this.g = g; this.d = d; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { return new VH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_channel, p, false)); }
                  public void onBindViewHolder(VH h, int i) { h.n.setText(g.get(i)); h.itemView.setOnClickListener(v -> { currentItems = d.get(g.get(i)); rvI.setAdapter(new ItemAdapter(currentItems)); }); }
                  public int getItemCount() { return g.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView n; VH(View v) { super(v); n = v.findViewById(R.id.txt_name); } }
              }

              class ItemAdapter extends RecyclerView.Adapter<ItemAdapter.VH> {
                  List<Ch> items; ItemAdapter(List<Ch> i) { items = i; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { return new VH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_channel, p, false)); }
                  public void onBindViewHolder(VH h, int i) {
                      Ch c = items.get(i); h.n.setText(c.n);
                      h.itemView.setOnClickListener(v -> { 
                          currentCh = c; tTitle.setText(c.n);
                          player.setMediaItem(MediaItem.fromUri(c.u)); player.prepare(); player.play(); 
                      });
                      h.itemView.setOnLongClickListener(v -> { toggleFull(true); return true; });
                  }
                  public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView n; VH(View v) { super(v); n = v.findViewById(R.id.txt_name); } }
              }

              private void loadData() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(0, url, res -> { parse(res); setMode("live"); }, null));
              }

              private void parse(String text) {
                  String[] lines = text.split("\n"); Ch cur = null; 
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) { 
                          cur = new Ch(); cur.n = l.split(",").length > 1 ? l.split(",")[1].trim() : "Unknown"; 
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "Other"; 
                      } else if (l.startsWith("http") && cur != null) {
                          cur.u = l.trim();
                          if (cur.g.toLowerCase().contains("movie")) movie.computeIfAbsent(cur.g, k->new ArrayList<>()).add(cur);
                          else live.computeIfAbsent(cur.g, k->new ArrayList<>()).add(cur);
                          cur = null;
                      }
                  }
              }
              protected void onStop() { super.onStop(); if(player != null) player.release(); }
          }
          EOF

          # تصاميم الأزرار
          cat <<EOF > app/src/main/res/drawable/tab_button_style.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true"><shape><solid android:color="#ff9100"/><corners android:radius="10dp"/></shape></item>
              <item><shape><solid android:color="#1c142e"/><corners android:radius="10dp"/></shape></item>
          </selector>
          EOF

          cat <<EOF > app/src/main/res/layout/item_channel.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="10dp" android:focusable="true" android:background="?android:attr/selectableItemBackground">
              <TextView android:id="@+id/txt_name" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#FFF" android:textSize="14sp" android:gravity="right"/>
          </LinearLayout>
          EOF

          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.rabie.iptv"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config" android:label="Rabie Pro V35"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: UI_V35_Download
        uses: actions/upload-artifact@v4
        with: { name: Rabie_Pro_V35_Final, path: app/build/outputs/apk/debug/*.apk }
