name: Rabie_Pro_V15_BigPlayer_Fixed
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_V15_BigPlayer
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # واجهة V15 مع تكبير المشغل وإضافة خاصية ملء الشاشة
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0a0714">
              
              <LinearLayout android:id="@+id/ui_layer" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="55dp" android:background="#000" android:gravity="center_vertical" android:padding="5dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE-TV PRO" android:textColor="#ff9100" android:textStyle="bold" android:layout_marginRight="10dp"/>
                      <Button android:id="@+id/btn_refresh" android:layout_width="65dp" android:layout_height="35dp" android:text="تحديث" android:textSize="8sp" android:backgroundTint="#1c142e"/>
                      <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                      <Button android:id="@+id/btn_live" android:layout_width="wrap_content" android:layout_height="35dp" android:text="قنوات" android:textSize="10sp"/>
                      <Button android:id="@+id/btn_movies" android:layout_width="wrap_content" android:layout_height="35dp" android:text="أفلام" android:textSize="10sp" android:layout_marginLeft="5dp"/>
                      <Button android:id="@+id/btn_series" android:layout_width="wrap_content" android:layout_height="35dp" android:text="مسلسلات" android:textSize="10sp" android:layout_marginLeft="5dp"/>
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_main" android:layout_width="130dp" android:layout_height="match_parent" android:background="#151515"/>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="160dp" android:layout_height="match_parent" android:background="#1a1a1a"/>
                      
                      <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#000">
                          <androidx.media3.ui.PlayerView android:id="@+id/exoplayer_view" 
                              android:layout_width="match_parent" android:layout_height="0dp" 
                              android:layout_weight="1"
                              android:background="#000"/>
                          <TextView android:id="@+id/tv_title" android:layout_width="match_parent" android:layout_height="wrap_content" 
                              android:padding="8dp" android:background="#1c142e" android:textColor="#ff9100" 
                              android:gravity="center" android:textSize="14sp" android:text="RABIE PRO"/>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>

              <androidx.media3.ui.PlayerView android:id="@+id/full_player" 
                  android:layout_width="match_parent" android:layout_height="match_parent" 
                  android:visibility="gone" android:background="#000"/>
          </RelativeLayout>
          EOF

          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private Map<String, List<Ch>> live = new LinkedHashMap<>(), movies = new LinkedHashMap<>(), series = new LinkedHashMap<>();
              private RecyclerView rvMain, rvItems;
              private PlayerView exoView, fullView;
              class Ch { String n, u, g; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  player = new ExoPlayer.Builder(this).build();
                  exoView = findViewById(R.id.exoplayer_view);
                  fullView = findViewById(R.id.full_player);
                  exoView.setPlayer(player);
                  
                  rvMain = findViewById(R.id.rv_main); rvItems = findViewById(R.id.rv_items);
                  rvMain.setLayoutManager(new LinearLayoutManager(this));
                  rvItems.setLayoutManager(new LinearLayoutManager(this));

                  loadData();

                  findViewById(R.id.btn_refresh).setOnClickListener(v -> loadData());
                  findViewById(R.id.btn_live).setOnClickListener(v -> showGroup(live));
                  findViewById(R.id.btn_movies).setOnClickListener(v -> showGroup(movies));
                  findViewById(R.id.btn_series).setOnClickListener(v -> showGroup(series));

                  // اضغط مرتين على المشغل ليدخل في وضع ملء الشاشة
                  exoView.setOnClickListener(v -> toggleFullScreen());
                  fullView.setOnClickListener(v -> toggleFullScreen());
              }

              private void loadData() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> {
                      parse(res);
                      showGroup(live);
                  }, null));
              }

              private void parse(String text) {
                  live.clear(); movies.clear(); series.clear();
                  String[] lines = text.split("\n"); Ch cur = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          cur = new Ch();
                          cur.n = l.split(",").length > 1 ? l.split(",")[1].trim() : "Channel";
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "General";
                      } else if (l.trim().startsWith("http") && cur != null) {
                          cur.u = l.trim();
                          String g = cur.g.toLowerCase();
                          Map<String, List<Ch>> target = (g.contains("movie") || g.contains("أفلام")) ? movies : 
                                                        (g.contains("series") || g.contains("مسلسلات")) ? series : live;
                          if (!target.containsKey(cur.g)) target.put(cur.g, new ArrayList<>());
                          target.get(cur.g).add(cur);
                          cur = null;
                      }
                  }
              }

              private void showGroup(Map<String, List<Ch>> data) {
                  rvMain.setAdapter(new GroupAdapter(new ArrayList<>(data.keySet()), data));
              }

              private void toggleFullScreen() {
                  if (fullView.getVisibility() == View.GONE) {
                      fullView.setPlayer(player);
                      fullView.setVisibility(View.VISIBLE);
                      findViewById(R.id.ui_layer).setVisibility(View.GONE);
                  } else {
                      exoView.setPlayer(player);
                      fullView.setVisibility(View.GONE);
                      findViewById(R.id.ui_layer).setVisibility(View.VISIBLE);
                  }
              }

              class GroupAdapter extends RecyclerView.Adapter<GroupAdapter.VH> {
                  List<String> groups; Map<String, List<Ch>> data;
                  GroupAdapter(List<String> g, Map<String, List<Ch>> d) { groups = g; data = d; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { 
                      Button b = new Button(p.getContext()); b.setTextColor(-1); b.setBackgroundColor(0); b.setTextSize(9); return new VH(b); 
                  }
                  public void onBindViewHolder(VH h, int i) {
                      h.b.setText(groups.get(i));
                      h.b.setOnClickListener(v -> rvItems.setAdapter(new ItemAdapter(data.get(groups.get(i)))));
                  }
                  public int getItemCount() { return groups.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v) { super(v); b = (Button)v; } }
              }

              class ItemAdapter extends RecyclerView.Adapter<ItemAdapter.VH> {
                  List<Ch> items; ItemAdapter(List<Ch> i) { items = i; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { 
                      TextView tv = new TextView(p.getContext()); tv.setPadding(20,30,20,30); tv.setTextColor(-1); return new VH(tv); 
                  }
                  public void onBindViewHolder(VH h, int i) {
                      h.tv.setText(items.get(i).n);
                      h.tv.setOnClickListener(v -> {
                          ((TextView)findViewById(R.id.tv_title)).setText(items.get(i).n);
                          player.setMediaItem(MediaItem.fromUri(items.get(i).u));
                          player.prepare(); player.play();
                      });
                  }
                  public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView tv; VH(View v) { super(v); tv = (TextView)v; } }
              }
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:label="Rabie Pro TV"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_APK
        uses: actions/upload-artifact@v4
        with: { name: Rabie_V15_BigPlayer_APK, path: app/build/outputs/apk/debug/*.apk }
