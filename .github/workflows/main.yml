name: Rabie_Pro_Remote_FullControl
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Remote_Friendly_App
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/ibostyle
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # خلفية التحديد للريموت (باش تعرف وين راك حاط بالريموت)
          cat <<EOF > app/src/main/res/drawable/selector.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true" android:drawable="@color/accent_orange"/>
              <item android:drawable="@color/panel_dark"/>
          </selector>
          EOF

          cat <<EOF > app/src/main/res/values/colors.xml
          <resources>
              <color name="bg_dark">#0a0714</color>
              <color name="panel_dark">#1c142e</color>
              <color name="accent_orange">#ff9100</color>
          </resources>
          EOF

          # واجهة ذكية (تدعم إخفاء القائمة للتكبير)
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="@color/bg_dark">
              
              <LinearLayout android:id="@+id/top_bar" android:layout_width="match_parent" android:layout_height="60dp"
                  android:orientation="horizontal" android:padding="10dp" android:background="#000">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" 
                      android:text="RABIE PRO" android:textColor="@color/accent_orange" android:textStyle="bold"/>
              </LinearLayout>

              <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                  <androidx.media3.ui.PlayerView android:id="@+id/exoplayer_view" 
                      android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                  
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_channels" 
                      android:layout_width="300dp" android:layout_height="match_parent" 
                      android:background="#130d21" android:focusable="true"/>
              </LinearLayout>
          </LinearLayout>
          EOF

          # كود الجافا مع دعم Double Click والريموت
          cat <<EOF > app/src/main/java/com/rabie/ibostyle/MainActivity.java
          package com.rabie.ibostyle;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private RecyclerView rv;
              private View topBar;
              private List<String> names = new ArrayList<>(), urls = new ArrayList<>();
              private long lastClickTime = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  topBar = findViewById(R.id.top_bar);
                  player = new ExoPlayer.Builder(this).build();
                  ((PlayerView)findViewById(R.id.exoplayer_view)).setPlayer(player);
                  
                  rv = findViewById(R.id.rv_channels);
                  rv.setLayoutManager(new LinearLayoutManager(this));

                  fetchData();
              }

              private void fetchData() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> {
                      String[] lines = res.split("\n");
                      for(int i=0; i<lines.length; i++) {
                          if(lines[i].contains("#EXTINF")) {
                              names.add(lines[i].split(",")[1]);
                              urls.add(lines[i+1].trim());
                          }
                      }
                      rv.setAdapter(new ChannelAdapter());
                  }, null));
              }

              class ChannelAdapter extends RecyclerView.Adapter<ChannelAdapter.VH> {
                  class VH extends RecyclerView.ViewHolder { 
                      Button b; 
                      VH(View v) { super(v); b = (Button)v; b.setFocusable(true); } 
                  }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) {
                      Button b = new Button(p.getContext());
                      b.setLayoutParams(new LayoutParams(-1, -2));
                      b.setBackgroundResource(R.drawable.selector);
                      return new VH(b);
                  }
                  @Override public void onBindViewHolder(VH h, int i) {
                      h.b.setText(names.get(i));
                      h.b.setOnClickListener(v -> {
                          long now = System.currentTimeMillis();
                          if (now - lastClickTime < 300) { // Double Click
                              rv.setVisibility(rv.getVisibility() == View.VISIBLE ? View.GONE : View.VISIBLE);
                              topBar.setVisibility(rv.getVisibility());
                          } else { // Single Click
                              player.setMediaItem(MediaItem.fromUri(urls.get(i)));
                              player.prepare(); player.play();
                          }
                          lastClickTime = now;
                      });
                  }
                  @Override public int getItemCount() { return names.size(); }
              }
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.ibostyle'; compileSdk 34; defaultConfig { minSdk 21; targetSdk 34; } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar"><activity android:name="com.rabie.ibostyle.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabie_TV_Remote_Edition
          path: app/build/outputs/apk/debug/*.apk
