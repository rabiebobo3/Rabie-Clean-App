name: Rabie_Pro_V33_Final_Ultimate
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_V33_Ultimate
        run: |
          # تنظيف كامل للمجلدات
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          
          # إنشاء مجلد التطبيق
          mkdir -p app/src/main/java/com/rabie/iptv app/src/main/res/layout app/src/main/res/drawable app/src/main/res/mipmap-xhdpi app/src/main/res/xml

          # ملف settings.gradle (هذا هو الصح باش يلقى مجلد app)
          echo "include ':app'" > settings.gradle
          
          # ملف gradle.properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # ملف build.gradle الرئيسي (Project level)
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # ملف app/build.gradle (App level)
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.rabie.iptv'
              compileSdk 34
              defaultConfig {
                  applicationId "com.rabie.iptv"
                  minSdk 21
                  targetSdk 34
                  versionCode 33
                  versionName "33.0"
              }
          }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF

          # تحميل أيقونات ربيع
          curl -L "https://l.top4top.io/p_3726ctx7u1.png" -o app/src/main/res/mipmap-xhdpi/ic_launcher.png
          curl -L "https://a.top4top.io/p_3726jb1sj0.png" -o app/src/main/res/drawable/app_banner_tv.png

          # (هنا تحط كود MainActivity والـ XML اللي تفاهمنا عليهم)
          # راني راح نختصر باش ما نطولش عليك، حط كود الـ Java والـ XML تاعك هنا

          # بناء المشروع
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: UI_V33_Ready
        uses: actions/upload-artifact@v4
        with: { name: Rabie_Pro_V33_Final, path: app/build/outputs/apk/debug/*.apk }
