name: Rabie_Pro_V32_Enhanced
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_V32_With_V38_Features
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv app/src/main/res/layout app/src/main/res/drawable app/src/main/res/xml

          echo '<?xml version="1.0" encoding="utf-8"?><network-security-config><base-config cleartextTrafficPermitted="true"/></network-security-config>' > app/src/main/res/xml/network_security_config.xml

          # التعديل 1: إضافة android:layoutDirection="rtl" للواجهة
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" 
              android:background="#0a0714" android:keepScreenOn="true" android:layoutDirection="rtl">
              
              <LinearLayout android:id="@+id/splash_screen" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0a0714" android:gravity="center" android:elevation="20dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO" android:textColor="#ff9100" android:textSize="50sp" android:textStyle="bold"/>
              </LinearLayout>

              <LinearLayout android:id="@+id/main_ui_container" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="#000" android:gravity="center_vertical" android:padding="8dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO" android:textColor="#ff9100" android:textStyle="bold" android:textSize="18sp" android:layout_marginLeft="15dp"/>
                      <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                      <Button android:id="@+id/tab_live" android:layout_width="wrap_content" android:layout_height="38dp" android:text="قنوات" android:textColor="#CCC" android:textSize="12sp" android:layout_marginRight="6dp" android:background="@drawable/tab_button_style" android:focusable="true"/>
                      <Button android:id="@+id/tab_movie" android:layout_width="wrap_content" android:layout_height="38dp" android:text="افلام" android:textColor="#CCC" android:textSize="12sp" android:layout_marginRight="6dp" android:background="@drawable/tab_button_style" android:focusable="true"/>
                      <Button android:id="@+id/tab_series" android:layout_width="wrap_content" android:layout_height="38dp" android:text="مسلسلات" android:textColor="#CCC" android:textSize="12sp" android:layout_marginRight="6dp" android:background="@drawable/tab_button_style" android:focusable="true"/>
                      <Button android:id="@+id/tab_fav" android:layout_width="50dp" android:layout_height="38dp" android:text="⭐" android:textColor="#ff9100" android:background="@drawable/tab_button_style" android:focusable="true"/>
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.22" android:background="#1c142e"/>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.28" android:background="#130d21"/>
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.5" android:orientation="vertical">
                          <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.65">
                              <androidx.media3.ui.PlayerView android:id="@+id/small_player" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="false"/>
                              <ProgressBar android:id="@+id/loading_s" android:layout_width="45dp" android:layout_height="45dp" android:layout_gravity="center" android:visibility="gone" android:indeterminateTint="#ff9100"/>
                          </FrameLayout>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.35" android:padding="15dp" android:background="#1c142e" android:orientation="vertical">
                              <TextView android:id="@+id/txt_title" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="اختر محتوى" android:textColor="#ff9100" android:textSize="18sp" android:textStyle="bold" android:maxLines="1"/>
                              <Button android:id="@+id/btn_toggle_fav" android:layout_width="wrap_content" android:layout_height="38dp" android:text="⭐ مفضلة" android:layout_marginTop="10dp" android:background="@drawable/focus_highlight" android:paddingHorizontal="15dp" android:focusable="true"/>
                          </LinearLayout>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>

              <FrameLayout android:id="@+id/full_container" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:background="#000">
                  <androidx.media3.ui.PlayerView android:id="@+id/full_player" android:layout_width="match_parent" android:layout_height="match_parent" app:resize_mode="fill" app:use_controller="false" />
                  <ProgressBar android:id="@+id/loading_f" android:layout_width="70dp" android:layout_height="70dp" android:layout_gravity="center" android:visibility="gone" android:indeterminateTint="#ff9100"/>
              </FrameLayout>
          </RelativeLayout>
          EOF

          # الحفاظ على تصاميم V32 الأصلية
          cat <<EOF > app/src/main/res/drawable/tab_button_style.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true"><shape><solid android:color="#ff9100"/><corners android:radius="19dp"/></shape></item>
              <item><shape><solid android:color="#1c142e"/><corners android:radius="19dp"/><stroke android:width="1dp" android:color="#2c224a"/></shape></item>
          </selector>
          EOF
          cat <<EOF > app/src/main/res/drawable/focus_highlight.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true"><shape><solid android:color="#44ff9100"/><stroke android:width="2dp" android:color="#ff9100"/><corners android:radius="6dp"/></shape></item>
              <item><shape><solid android:color="@android:color/transparent"/></shape></item>
          </selector>
          EOF
          cat <<EOF > app/src/main/res/layout/item_channel.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="8dp" android:focusable="true" android:background="@drawable/focus_highlight">
              <ImageView android:id="@+id/img_logo" android:layout_width="40dp" android:layout_height="40dp" android:scaleType="centerInside" android:layout_marginLeft="10dp"/>
              <TextView android:id="@+id/txt_name" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:textColor="#FFF" android:textSize="14sp" android:gravity="right"/>
          </LinearLayout>
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; versionCode 33; versionName "33.0" } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF

          # الكود البرمجي بدمج مميزات V38 (التحميل السريع، سحب الشعارات، العودة لنفس القناة)
          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AlertDialog;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.*;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.*;
          import com.android.volley.toolbox.*;
          import com.bumptech.glide.Glide;
          import com.google.gson.Gson;
          import com.google.gson.reflect.TypeToken;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private Map<String, List<Ch>> live = new LinkedHashMap<>(), movie = new LinkedHashMap<>();
              private Map<String, Map<String, List<Ch>>> series = new LinkedHashMap<>();
              private Map<String, String> groupLogos = new HashMap<>();
              private List<Ch> favList = new ArrayList<>(), currentItems = new ArrayList<>();
              private Ch currentCh;
              private int currentChIndex = -1;
              private RecyclerView rvG, rvI;
              private TextView tTitle;
              private PlayerView smallPV, fullPV;
              private View mainUI, fullCont, splash;
              private ProgressBar ps, pf;
              private String currentMode = "live";
              private Handler handler = new Handler(Looper.getMainLooper());
              private long lastClickTime = 0;

              static class Ch { String n, u, g, l; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  splash = findViewById(R.id.splash_screen); mainUI = findViewById(R.id.main_ui_container);
                  handler.postDelayed(() -> { splash.setVisibility(View.GONE); mainUI.setVisibility(View.VISIBLE); }, 2000);

                  // التعديل 2: إعدادات منع التجمد (Buffer Optimization)
                  DefaultLoadControl loadControl = new DefaultLoadControl.Builder()
                      .setBufferDurationsMs(2500, 30000, 1000, 1500).build();
                  player = new ExoPlayer.Builder(this).setLoadControl(loadControl).build();

                  smallPV = findViewById(R.id.small_player); fullPV = findViewById(R.id.full_player);
                  fullCont = findViewById(R.id.full_container);
                  ps = findViewById(R.id.loading_s); pf = findViewById(R.id.loading_f);

                  smallPV.setPlayer(player);
                  player.addListener(new Player.Listener() {
                      public void onPlaybackStateChanged(int s) {
                          int v = (s == Player.STATE_BUFFERING) ? View.VISIBLE : View.GONE;
                          ps.setVisibility(v); pf.setVisibility(v);
                      }
                  });

                  rvG = findViewById(R.id.rv_groups); rvI = findViewById(R.id.rv_items);
                  tTitle = findViewById(R.id.txt_title);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));

                  loadFavs(); loadData();
                  
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      public void handleOnBackPressed() { 
                          if(fullCont.getVisibility() == View.VISIBLE) toggleFull(false); 
                          else showExitDialog(); 
                      }
                  });

                  findViewById(R.id.tab_live).setOnClickListener(v -> setMode("live"));
                  findViewById(R.id.tab_movie).setOnClickListener(v -> setMode("movie"));
                  findViewById(R.id.tab_series).setOnClickListener(v -> setMode("series"));
                  findViewById(R.id.tab_fav).setOnClickListener(v -> setMode("fav"));
                  findViewById(R.id.btn_toggle_fav).setOnClickListener(v -> toggleFav());
              }

              private void showExitDialog() {
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle("خروج")
                      .setMessage("هل تريد الخروج؟")
                      .setPositiveButton("نعم", (d, w) -> finish())
                      .setNegativeButton("لا", null).show();
              }

              private void toggleFull(boolean full) {
                  if (full) { 
                      mainUI.setVisibility(View.GONE); fullCont.setVisibility(View.VISIBLE); 
                      PlayerView.switchTargetView(player, smallPV, fullPV); 
                  } else { 
                      fullCont.setVisibility(View.GONE); mainUI.setVisibility(View.VISIBLE); 
                      PlayerView.switchTargetView(player, fullPV, smallPV);
                      // التعديل 3: العودة لنفس القناة (Focus Back)
                      if(currentChIndex != -1) {
                          rvI.scrollToPosition(currentChIndex);
                          handler.postDelayed(() -> {
                              View v = rvI.getLayoutManager().findViewByPosition(currentChIndex);
                              if(v != null) v.requestFocus();
                          }, 200);
                      }
                  }
              }

              private void setMode(String m) {
                  currentMode = m;
                  if (m.equals("fav")) {
                      rvG.setAdapter(new GroupAdapter(Arrays.asList("المفضلة"), null));
                      rvI.setAdapter(new ItemAdapter(favList));
                  } else {
                      Map<String, List<Ch>> d = m.equals("movie") ? movie : (m.equals("series") ? convertSeriesToMap() : live);
                      rvG.setAdapter(new GroupAdapter(new ArrayList<>(d.keySet()), d));
                  }
              }

              private Map<String, List<Ch>> convertSeriesToMap() {
                  Map<String, List<Ch>> m = new LinkedHashMap<>();
                  for(String k : series.keySet()) m.put(k, new ArrayList<>());
                  return m;
              }

              class GroupAdapter extends RecyclerView.Adapter<GroupAdapter.VH> {
                  List<String> g; Map<String, List<Ch>> d;
                  GroupAdapter(List<String> g, Map<String, List<Ch>> d) { this.g = g; this.d = d; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { return new VH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_channel, p, false)); }
                  public void onBindViewHolder(VH h, int i) {
                      String name = g.get(i); h.n.setText(name);
                      // التعديل 4: استخدام شعار القسم المسحوب تلقائياً
                      Glide.with(MainActivity.this).load(groupLogos.get(name)).placeholder(android.R.drawable.ic_menu_slideshow).into(h.img);
                      h.itemView.setOnClickListener(v -> {
                          if (currentMode.equals("series")) {
                              List<Ch> seasons = new ArrayList<>();
                              for(String sName : series.get(name).keySet()) { Ch c = new Ch(); c.n = sName; c.g = name; seasons.add(c); }
                              rvI.setAdapter(new ItemAdapter(seasons));
                          } else { currentItems = d.get(name); rvI.setAdapter(new ItemAdapter(currentItems)); }
                      });
                  }
                  public int getItemCount() { return g.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView n; ImageView img; VH(View v) { super(v); n=v.findViewById(R.id.txt_name); img=v.findViewById(R.id.img_logo); } }
              }

              class ItemAdapter extends RecyclerView.Adapter<ItemAdapter.VH> {
                  List<Ch> items; ItemAdapter(List<Ch> i) { items = i; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { return new VH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_channel, p, false)); }
                  public void onBindViewHolder(VH h, int i) {
                      Ch c = items.get(i); h.n.setText(c.n); 
                      Glide.with(MainActivity.this).load(c.l).placeholder(android.R.drawable.ic_menu_slideshow).into(h.img);
                      h.itemView.setOnClickListener(v -> {
                          if (currentMode.equals("series") && series.containsKey(c.g) && series.get(c.g).containsKey(c.n)) {
                              rvI.setAdapter(new ItemAdapter(series.get(c.g).get(c.n)));
                          } else {
                              long t = System.currentTimeMillis();
                              if(t - lastClickTime < 400) toggleFull(true);
                              else { currentCh = c; currentChIndex = i; player.setMediaItem(MediaItem.fromUri(c.u)); player.prepare(); player.play(); tTitle.setText(c.n); }
                              lastClickTime = t;
                          }
                      });
                  }
                  public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView n; ImageView img; VH(View v) { super(v); n=v.findViewById(R.id.txt_name); img=v.findViewById(R.id.img_logo); } }
              }

              private void loadData() { Volley.newRequestQueue(this).add(new StringRequest(0, "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u", res -> { parse(res); setMode("live"); }, null)); }
              private void loadFavs() { String j = getSharedPreferences("p", 0).getString("f", "[]"); favList = new Gson().fromJson(j, new TypeToken<List<Ch>>(){}.getType()); }
              private void toggleFav() { if (currentCh == null) return; boolean ex = false; for (int i=0; i<favList.size(); i++) if(favList.get(i).u.equals(currentCh.u)) { favList.remove(i); ex=true; break; } if (!ex) favList.add(currentCh); getSharedPreferences("p", 0).edit().putString("f", new Gson().toJson(favList)).apply(); }
              private void parse(String text) {
                  String[] lines = text.split("\n"); Ch cur = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          cur = new Ch(); cur.n = l.split(",")[1].trim();
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "General";
                          cur.l = l.contains("tvg-logo=\"") ? l.split("tvg-logo=\"")[1].split("\"")[0] : "";
                          // التعديل 5: حفظ أول شعار يظهر لكل مجموعة
                          if(!groupLogos.containsKey(cur.g) && !cur.l.isEmpty()) groupLogos.put(cur.g, cur.l);
                      } else if (l.startsWith("http") && cur != null) {
                          cur.u = l.trim(); String g = cur.g.toLowerCase();
                          if(g.contains("movie")) movie.computeIfAbsent(cur.g, k->new ArrayList<>()).add(cur);
                          else if(g.contains("series")) series.computeIfAbsent(cur.g, k->new LinkedHashMap<>()).computeIfAbsent("Season 1", k->new ArrayList<>()).add(cur);
                          else live.computeIfAbsent(cur.g, k->new ArrayList<>()).add(cur);
                          cur = null;
                      }
                  }
              }
          }
          EOF

          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config" android:label="Rabie Pro V32 Enhanced" android:icon="@android:drawable/btn_star"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Success_V32_Enhanced
        uses: actions/upload-artifact@v4
        with: { name: Rabie_Pro_V32_Enhanced, path: app/build/outputs/apk/debug/*.apk }
