name: Rabie_Ibo_Pro_V29_Series_Fix
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Ibo_Pro_Series
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat <<EOF > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#FF000000</color>
              <color name="ibo_orange">#ffff9100</color>
              <color name="card_bg">#1A1A1A</color>
          </resources>
          EOF

          # تصميم الكارد
          cat <<EOF > app/src/main/res/layout/item_card.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="vertical" android:padding="4dp" android:gravity="center">
              <ImageView android:id="@+id/img_logo" android:layout_width="110dp" android:layout_height="160dp"
                  android:scaleType="centerCrop" android:background="#222"/>
              <TextView android:id="@+id/txt_name" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:textColor="#FFF" android:textSize="9sp" android:gravity="center" android:lines="1"/>
          </LinearLayout>
          EOF

          # الواجهة الرئيسية
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0a0714">
              
              <LinearLayout android:id="@+id/main_ui" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="50dp" android:gravity="center_vertical" android:padding="8dp" android:background="#000">
                      <TextView android:id="@+id/nav_title" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO TV" android:textColor="#ff9100" android:textStyle="bold"/>
                      <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                      <Button android:id="@+id/b_live" android:layout_width="wrap_content" android:layout_height="35dp" android:text="LIVE" android:textSize="8sp"/>
                      <Button android:id="@+id/b_movies" android:layout_width="wrap_content" android:layout_height="35dp" android:text="MOVIES" android:textSize="8sp" android:layout_marginLeft="5dp"/>
                      <Button android:id="@+id/b_series" android:layout_width="wrap_content" android:layout_height="35dp" android:text="SERIES" android:textSize="8sp" android:layout_marginLeft="5dp"/>
                  </LinearLayout>

                  <LinearLayout android:id="@+id/lay_live" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_g" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.3" android:background="#1c142e"/>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_i" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.3" android:background="#130d21"/>
                      <androidx.media3.ui.PlayerView android:id="@+id/pv_small" android:layout_width="0dp" android:layout_height="240dp" android:layout_weight="0.4" xmlns:app="http://schemas.android.com/apk/res-auto" app:use_controller="false"/>
                  </LinearLayout>

                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_grid" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:padding="5dp"/>
              </LinearLayout>

              <androidx.media3.ui.PlayerView android:id="@+id/pv_full" android:layout_width="match_parent" android:layout_height="match_parent"
                  android:visibility="gone" android:background="#000" xmlns:app="http://schemas.android.com/apk/res-auto" app:resize_mode="fill" app:use_controller="true"/>
          </RelativeLayout>
          EOF

          # كود الجافا (تنظيم المسلسلات)
          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import com.bumptech.glide.Glide;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private PlayerView pvSmall, pvFull;
              private View mainUI, layLive;
              private RecyclerView rvG, rvI, rvGrid;
              private Map<String, List<Ch>> live = new LinkedHashMap<>(), movies = new LinkedHashMap<>(), series = new LinkedHashMap<>();
              private TextView navTitle;
              class Ch { String n, u, g, l; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  player = new ExoPlayer.Builder(this).build();
                  pvSmall = findViewById(R.id.pv_small); pvFull = findViewById(R.id.pv_full);
                  mainUI = findViewById(R.id.main_ui); layLive = findViewById(R.id.lay_live);
                  rvG = findViewById(R.id.rv_g); rvI = findViewById(R.id.rv_i); rvGrid = findViewById(R.id.rv_grid);
                  navTitle = findViewById(R.id.nav_title);
                  
                  pvSmall.setPlayer(player); pvFull.setPlayer(player);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));
                  rvGrid.setLayoutManager(new GridLayoutManager(this, 6));

                  loadData();
                  setupGestures();
                  findViewById(R.id.b_live).setOnClickListener(v -> { layLive.setVisibility(View.VISIBLE); rvGrid.setVisibility(View.GONE); });
                  findViewById(R.id.b_movies).setOnClickListener(v -> showGrid(movies));
                  findViewById(R.id.b_series).setOnClickListener(v -> showGrid(series));
              }

              private void setupGestures() {
                  GestureDetector gd = new GestureDetector(this, new GestureDetector.SimpleOnGestureListener() {
                      @Override public boolean onDoubleTap(MotionEvent e) { toggleFull(true); return true; }
                  });
                  pvSmall.setOnTouchListener((v, ev) -> gd.onTouchEvent(ev));
              }

              private void toggleFull(boolean full) {
                  pvFull.setVisibility(full ? View.VISIBLE : View.GONE);
                  mainUI.setVisibility(full ? View.GONE : View.VISIBLE);
              }

              private void loadData() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> {
                      parse(res); rvG.setAdapter(new GAdapter(new ArrayList<>(live.keySet())));
                  }, null));
              }

              private void parse(String text) {
                  String[] lines = text.split("\n"); Ch cur = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          cur = new Ch(); cur.n = l.split(",")[1].trim();
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "General";
                          cur.l = l.contains("tvg-logo=\"") ? l.split("tvg-logo=\"")[1].split("\"")[0] : "";
                      } else if (l.startsWith("http") && cur != null) {
                          cur.u = l.trim();
                          String g = cur.g.toLowerCase();
                          if (g.contains("movie")) movies.computeIfAbsent(cur.g, k -> new ArrayList<>()).add(cur);
                          else if (g.contains("series")) series.computeIfAbsent(cur.g, k -> new ArrayList<>()).add(cur);
                          else live.computeIfAbsent(cur.g, k -> new ArrayList<>()).add(cur);
                          cur = null;
                      }
                  }
              }

              private void showGrid(Map<String, List<Ch>> data) {
                  layLive.setVisibility(View.GONE); rvGrid.setVisibility(View.VISIBLE);
                  List<Ch> all = new ArrayList<>(); for(List<Ch> l : data.values()) all.addAll(l);
                  rvGrid.setAdapter(new CardAdapter(all));
              }

              @Override public void onBackPressed() {
                  if (pvFull.getVisibility() == View.VISIBLE) toggleFull(false);
                  else if (rvGrid.getVisibility() == View.VISIBLE) { rvGrid.setVisibility(View.GONE); layLive.setVisibility(View.VISIBLE); }
                  else super.onBackPressed();
              }

              class GAdapter extends RecyclerView.Adapter<GAdapter.VH> {
                  List<String> d; GAdapter(List<String> d) { this.d = d; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { Button b = new Button(p.getContext()); b.setTextColor(-1); b.setBackgroundColor(0); return new VH(b); }
                  @Override public void onBindViewHolder(VH h, int i) { h.b.setText(d.get(i)); h.b.setOnClickListener(v -> rvI.setAdapter(new IAdapter(live.get(d.get(i))))); }
                  @Override public int getItemCount() { return d.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v) { super(v); b = (Button)v; } }
              }

              class IAdapter extends RecyclerView.Adapter<IAdapter.VH> {
                  List<Ch> items; IAdapter(List<Ch> i) { items = i; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { TextView tv = new TextView(p.getContext()); tv.setPadding(20,20,20,20); tv.setTextColor(-1); return new VH(tv); }
                  @Override public void onBindViewHolder(VH h, int i) { h.tv.setText(items.get(i).n); h.tv.setOnClickListener(v -> { player.setMediaItem(MediaItem.fromUri(items.get(i).u)); player.prepare(); player.play(); }); }
                  @Override public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView tv; VH(View v) { super(v); tv = (TextView)v; } }
              }

              class CardAdapter extends RecyclerView.Adapter<CardAdapter.VH> {
                  List<Ch> items; CardAdapter(List<Ch> i) { items = i; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { View v = LayoutInflater.from(p.getContext()).inflate(R.layout.item_card, p, false); return new VH(v); }
                  @Override public void onBindViewHolder(VH h, int i) {
                      Ch c = items.get(i); h.name.setText(c.n);
                      Glide.with(MainActivity.this).load(c.l).placeholder(android.R.drawable.ic_menu_gallery).into(h.img);
                      h.itemView.setOnClickListener(v -> { toggleFull(true); player.setMediaItem(MediaItem.fromUri(c.u)); player.prepare(); player.play(); });
                  }
                  @Override public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { ImageView img; TextView name; VH(View v) { super(v); img=v.findViewById(R.id.img_logo); name=v.findViewById(R.id.txt_name); } }
              }
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:label="Rabie Ibo Pro"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_V29
        uses: actions/upload-artifact@v4
        with: { name: Rabie_Ibo_V29, path: app/build/outputs/apk/debug/*.apk }
