name: Rabie_Native_Gist_Server
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_IPTV_With_Gist_Server
        run: |
          # 1. تنظيف شامل (لضمان النجاح ✅)
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/ibostyle
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 2. ألوان الواجهة (نفس الصورة 2)
          cat <<EOF > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#0a0714</color>
              <color name="panel_dark">#1c142e</color>
              <color name="accent_orange">#ff9100</color>
              <color name="item_bg">#130d21</color>
          </resources>
          EOF

          # 3. واجهة المستخدم (Landscape)
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="@color/bg_dark">
              
              <LinearLayout android:layout_width="match_parent" android:layout_height="60dp"
                  android:orientation="horizontal" android:gravity="center_vertical" android:padding="10dp" android:background="#000">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" 
                      android:text="RABIE-\nTV PRO" android:textColor="@color/accent_orange" android:textSize="14sp" android:textStyle="bold" android:layout_marginRight="15dp"/>
                  <Button android:layout_width="wrap_content" android:layout_height="35dp" android:text="تحديث" android:backgroundTint="@color/panel_dark" android:textColor="#fff" android:textSize="10sp"/>
                  <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="LIVE" android:textColor="@color/accent_orange" android:textSize="14sp" android:textStyle="bold" android:layout_marginLeft="15dp"/>
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="MOVIES" android:textColor="#fff" android:textSize="14sp" android:layout_marginLeft="15dp"/>
              </LinearLayout>

              <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:orientation="vertical">
                      <androidx.media3.ui.PlayerView android:id="@+id/exoplayer_view" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:background="#000" />
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="15dp" android:background="@color/panel_dark" android:orientation="vertical">
                          <TextView android:id="@+id/txt_ch_name" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="تحميل القائمة..." android:textColor="@color/accent_orange" android:textSize="18sp" android:textStyle="bold"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Gist Server Active ✅" android:textColor="#888" android:textSize="11sp"/>
                      </LinearLayout>
                  </LinearLayout>
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_channels" android:layout_width="320dp" android:layout_height="match_parent" android:background="@color/item_bg"/>
              </LinearLayout>
          </LinearLayout>
          EOF

          # 4. كود الجافا (الربط مع رابط الـ Gist)
          cat <<EOF > app/src/main/java/com/rabie/ibostyle/MainActivity.java
          package com.rabie.ibostyle;
          import android.os.Bundle;
          import android.content.pm.ActivityInfo;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              // رابط الـ Gist الخاص بك
              private String GIST_URL = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
                  setContentView(R.layout.activity_main);
                  
                  PlayerView pv = findViewById(R.id.exoplayer_view);
                  player = new ExoPlayer.Builder(this).build();
                  pv.setPlayer(player);

                  // محرك التشغيل يتصل بالرابط مباشرة
                  MediaItem mediaItem = MediaItem.fromUri(GIST_URL);
                  player.setMediaItem(mediaItem);
                  player.prepare();
                  player.play();
              }
              @Override
              protected void onDestroy() { super.onDestroy(); if(player!=null) player.release(); }
          }
          EOF

          # 5. بناء المشروع والاعتمادات
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android {
              namespace 'com.rabie.ibostyle'
              compileSdk 34
              defaultConfig { applicationId "com.rabie.ibostyle"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0-Gist" }
          }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:label="Rabie Gist Pro"><activity android:name="com.rabie.ibostyle.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Download_Gist_APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabie_Gist_Server_APK
          path: app/build/outputs/apk/debug/*.apk
