name: Rabie_Pro_Final_V11
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Ultimate_App
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # 1. تعريف الألوان والأيقونة
          cat <<EOF > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
              <color name="orange_main">#ffff9100</color>
              <color name="dark_bg">#FF0a0714</color>
              <color name="panel_bg">#FF1c142e</color>
          </resources>
          EOF

          # 2. واجهة شاشة الترحيب (Splash)
          cat <<EOF > app/src/main/res/layout/activity_splash.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000" android:gravity="center">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" 
                  android:text="RABIE-TV PRO" android:textColor="#ff9100" android:textSize="40sp" android:textStyle="bold"/>
              <ProgressBar android:layout_width="50dp" android:layout_height="50dp" android:layout_alignParentBottom="true" 
                  android:layout_centerHorizontal="true" android:layout_marginBottom="50dp" android:indeterminateTint="#ff9100"/>
          </RelativeLayout>
          EOF

          # 3. الواجهة الرئيسية المقسمة
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/dark_bg">
              
              <LinearLayout android:id="@+id/main_content" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  <LinearLayout android:id="@+id/top_nav" android:layout_width="match_parent" android:layout_height="50dp" android:background="#000" android:gravity="center_vertical" android:padding="5dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE-TV" android:textColor="@color/orange_main" android:textStyle="bold"/>
                      <Button android:id="@+id/btn_live" android:layout_width="wrap_content" android:layout_height="35dp" android:text="قنوات" android:textSize="10sp" android:layout_marginLeft="15dp"/>
                      <Button android:id="@+id/btn_movies" android:layout_width="wrap_content" android:layout_height="35dp" android:text="أفلام" android:textSize="10sp" android:layout_marginLeft="5dp"/>
                      <Button android:id="@+id/btn_series" android:layout_width="wrap_content" android:layout_height="35dp" android:text="مسلسلات" android:textSize="10sp" android:layout_marginLeft="5dp"/>
                      <Button android:id="@+id/btn_fav_list" android:layout_width="wrap_content" android:layout_height="35dp" android:text="⭐ المفضلة" android:textSize="10sp" android:layout_marginLeft="5dp" android:backgroundTint="@color/orange_main"/>
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                      <LinearLayout android:id="@+id/side_lists" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.4">
                          <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_main" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:background="#151515"/>
                          <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_sub" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:background="#1a1a1a" android:visibility="gone"/>
                          <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:background="#202020"/>
                      </LinearLayout>
                      
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.6" android:orientation="vertical">
                          <androidx.media3.ui.PlayerView android:id="@+id/exoplayer_view" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.7"/>
                          <LinearLayout android:id="@+id/info_panel" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="0.3" android:padding="15dp" android:background="@color/panel_bg" android:orientation="vertical">
                              <TextView android:id="@+id/tv_title" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE-TV PRO" android:textColor="@color/orange_main" android:textSize="18sp" android:textStyle="bold"/>
                              <TextView android:id="@+id/tv_desc" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="اختر محتوى للبدء" android:textColor="#fff" android:textSize="13sp"/>
                          </LinearLayout>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>

              <androidx.media3.ui.PlayerView android:id="@+id/full_player" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:background="#000"/>
          </RelativeLayout>
          EOF

          # 4. كود الجافا (MainActivity) مع منطق التكبير والمفضلة
          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private PlayerView mainPV, fullPV;
              private Map<String, Map<String, List<Ch>>> seriesData = new LinkedHashMap<>();
              private Map<String, List<Ch>> liveData = new LinkedHashMap<>(), movieData = new LinkedHashMap<>();
              private List<Ch> favData = new ArrayList<>();
              private RecyclerView rvMain, rvSub, rvItems;
              private boolean isFull = false;

              class Ch { String n, u, g; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  player = new ExoPlayer.Builder(this).build();
                  mainPV = findViewById(R.id.exoplayer_view);
                  fullPV = findViewById(R.id.full_player);
                  mainPV.setPlayer(player);
                  fullPV.setPlayer(player);
                  
                  rvMain = findViewById(R.id.rv_main); rvSub = findViewById(R.id.rv_sub); rvItems = findViewById(R.id.rv_items);
                  rvMain.setLayoutManager(new LinearLayoutManager(this));
                  rvSub.setLayoutManager(new LinearLayoutManager(this));
                  rvItems.setLayoutManager(new LinearLayoutManager(this));

                  loadData();
                  setupGestures(mainPV);
                  setupGestures(fullPV);

                  findViewById(R.id.btn_live).setOnClickListener(v -> showLive());
                  findViewById(R.id.btn_movies).setOnClickListener(v -> showMovies());
                  findViewById(R.id.btn_series).setOnClickListener(v -> showSeries());
                  findViewById(R.id.btn_fav_list).setOnClickListener(v -> {
                      rvSub.setVisibility(View.GONE);
                      rvItems.setAdapter(new ItemAdapter(favData));
                  });
              }

              private void setupGestures(View v) {
                  GestureDetector gd = new GestureDetector(this, new GestureDetector.SimpleOnGestureListener() {
                      @Override public boolean onDoubleTap(MotionEvent e) { toggleFull(); return true; }
                  });
                  v.setOnTouchListener((view, event) -> gd.onTouchEvent(event));
              }

              private void toggleFull() {
                  isFull = !isFull;
                  fullPV.setVisibility(isFull ? View.VISIBLE : View.GONE);
                  findViewById(R.id.main_content).setVisibility(isFull ? View.GONE : View.VISIBLE);
              }

              @Override public void onBackPressed() {
                  if (isFull) toggleFull(); else super.onBackPressed();
              }

              private void parse(String text) {
                  String[] lines = text.split("\n"); Ch cur = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          cur = new Ch(); cur.n = l.split(",")[1].trim();
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "General";
                      } else if (l.startsWith("http") && cur != null) {
                          cur.u = l.trim();
                          if (cur.g.toLowerCase().contains("series")) {
                              String name = cur.n.split(" S[0-9]")[0];
                              String season = cur.n.contains(" S") ? "Season " + cur.n.split(" S")[1].substring(0,2) : "Default";
                              if (!seriesData.containsKey(name)) seriesData.put(name, new LinkedHashMap<>());
                              if (!seriesData.get(name).containsKey(season)) seriesData.get(name).put(season, new ArrayList<>());
                              seriesData.get(name).get(season).add(cur);
                          } else if (cur.g.toLowerCase().contains("movie")) {
                              if (!movieData.containsKey(cur.g)) movieData.put(cur.g, new ArrayList<>());
                              movieData.get(cur.g).add(cur);
                          } else {
                              if (!liveData.containsKey(cur.g)) liveData.put(cur.g, new ArrayList<>());
                              liveData.get(cur.g).add(cur);
                          }
                          cur = null;
                      }
                  }
              }

              private void showSeries() {
                  rvSub.setVisibility(View.VISIBLE);
                  rvMain.setAdapter(new GenAdapter(new ArrayList<>(seriesData.keySet()), (p, n) -> {
                      rvSub.setAdapter(new GenAdapter(new ArrayList<>(seriesData.get(n).keySet()), (p2, sN) -> {
                          rvItems.setAdapter(new ItemAdapter(seriesData.get(n).get(sN)));
                      }));
                  }));
              }

              private void showLive() {
                  rvSub.setVisibility(View.GONE);
                  rvMain.setAdapter(new GenAdapter(new ArrayList<>(liveData.keySet()), (p, n) -> {
                      rvItems.setAdapter(new ItemAdapter(liveData.get(n)));
                  }));
              }

              private void showMovies() {
                  rvSub.setVisibility(View.GONE);
                  rvMain.setAdapter(new GenAdapter(new ArrayList<>(movieData.keySet()), (p, n) -> {
                      rvItems.setAdapter(new ItemAdapter(movieData.get(name)));
                  }));
              }

              private void loadData() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> { parse(res); showLive(); }, null));
              }

              class GenAdapter extends RecyclerView.Adapter<GenAdapter.VH> {
                  List<String> d; OnItemClick c;
                  GenAdapter(List<String> d, OnItemClick c) { this.d = d; this.c = c; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) {
                      Button b = new Button(p.getContext()); b.setTextColor(-1); b.setBackgroundColor(0); b.setTextSize(10);
                      return new VH(b);
                  }
                  @Override public void onBindViewHolder(VH h, int i) {
                      h.b.setText(d.get(i)); h.b.setOnClickListener(v -> c.onClick(i, d.get(i)));
                  }
                  @Override public int getItemCount() { return d.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v) { super(v); b = (Button)v; } }
              }

              class ItemAdapter extends RecyclerView.Adapter<ItemAdapter.VH> {
                  List<Ch> items; ItemAdapter(List<Ch> i) { items = i; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) {
                      TextView tv = new TextView(p.getContext()); tv.setPadding(20,20,20,20); tv.setTextColor(-1);
                      return new VH(tv);
                  }
                  @Override public void onBindViewHolder(VH h, int i) {
                      Ch ch = items.get(i); h.tv.setText(ch.n);
                      h.tv.setOnClickListener(v -> {
                          player.setMediaItem(MediaItem.fromUri(ch.u));
                          player.prepare(); player.play();
                      });
                      h.tv.setOnLongClickListener(v -> {
                          new androidx.appcompat.app.AlertDialog.Builder(MainActivity.this)
                              .setTitle("المفضلة")
                              .setMessage("هل تريد إضافة " + ch.n + " للمفضلة؟")
                              .setPositiveButton("نعم", (d, w) -> { favData.add(ch); Toast.makeText(MainActivity.this, "تم!", 0).show(); })
                              .show();
                          return true;
                      });
                  }
                  @Override public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView tv; VH(View v) { super(v); tv = (TextView)v; } }
              }

              interface OnItemClick { void onClick(int p, String n); }
              @Override protected void onPause() { super.onPause(); if(player != null) player.stop(); }
          }
          EOF

          # 5. شاشة الترحيب (SplashActivity)
          cat <<EOF > app/src/main/java/com/rabie/iptv/SplashActivity.java
          package com.rabie.iptv;
          import android.content.Intent;
          import android.os.*;
          import androidx.appcompat.app.AppCompatActivity;
          public class SplashActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  new Handler().postDelayed(() -> {
                      startActivity(new Intent(this, MainActivity.class));
                      finish();
                  }, 2500);
              }
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:label="Rabie Pro TV"><activity android:name="com.rabie.iptv.SplashActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><activity android:name="com.rabie.iptv.MainActivity" android:screenOrientation="landscape"/></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_Ultimate_V11
        uses: actions/upload-artifact@v4
        with: { name: Rabie_Ultimate_V11, path: app/build/outputs/apk/debug/*.apk }
