name: Rabie_Professional_IPTV_Full_Logic
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Ibo_Logic_App
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. تصميم الواجهة بـ 3 أعمدة (نفس الـ HTML)
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#0a0714">
              
              <LinearLayout android:layout_width="match_parent" android:layout_height="55dp"
                  android:orientation="horizontal" android:gravity="center_vertical" android:padding="10dp" android:background="#000">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" 
                      android:text="RABIE-TV PRO" android:textColor="#ff9100" android:textSize="18sp" android:textStyle="bold"/>
                  <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                  <Button android:id="@+id/btn_live" android:layout_width="wrap_content" android:layout_height="40dp" android:text="القنوات" android:backgroundTint="#1c142e"/>
                  <Button android:id="@+id/btn_movies" android:layout_width="wrap_content" android:layout_height="40dp" android:text="الأفلام" android:backgroundTint="#1c142e" android:layout_marginLeft="5dp"/>
              </LinearLayout>

              <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" 
                      android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.22" android:background="#1c142e"/>
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" 
                      android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.28" android:background="#130d21"/>
                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.5" android:orientation="vertical">
                      <androidx.media3.ui.PlayerView android:id="@+id/exoplayer_view" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:background="#000"/>
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="20dp" android:background="#1c142e" android:orientation="vertical">
                          <TextView android:id="@+id/txt_title" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="اختر محتوى" android:textColor="#ff9100" android:textSize="20sp" android:textStyle="bold"/>
                          <TextView android:id="@+id/txt_group" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="يرجى التحديد لبدء البث" android:textColor="#aaa" android:textSize="14sp"/>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
          </LinearLayout>
          EOF

          # 2. كود الجافا الذكي (The Smart Parser)
          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private Map<String, List<Item>> liveData = new LinkedHashMap<>(), movieData = new LinkedHashMap<>();
              private String currentMode = "live";
              private RecyclerView rvGroups, rvItems;
              private TextView txtTitle, txtGroup;

              class Item { String name, url, group, logo; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  player = new ExoPlayer.Builder(this).build();
                  ((PlayerView)findViewById(R.id.exoplayer_view)).setPlayer(player);
                  rvGroups = findViewById(R.id.rv_groups);
                  rvItems = findViewById(R.id.rv_items);
                  txtTitle = findViewById(R.id.txt_title);
                  txtGroup = findViewById(R.id.txt_group);
                  
                  rvGroups.setLayoutManager(new LinearLayoutManager(this));
                  rvItems.setLayoutManager(new LinearLayoutManager(this));

                  loadM3U();
                  
                  findViewById(R.id.btn_live).setOnClickListener(v -> switchMode("live"));
                  findViewById(R.id.btn_movies).setOnClickListener(v -> switchMode("movie"));
              }

              private void loadM3U() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, response -> {
                      parse(response);
                      switchMode("live");
                  }, null));
              }

              private void parse(String text) {
                  String[] lines = text.split("\n");
                  Item current = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          current = new Item();
                          current.name = l.split(",")[1].trim();
                          current.group = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "أخرى";
                      } else if (l.startsWith("http") && current != null) {
                          current.url = l.trim();
                          Map<String, List<Item>> target = (current.group.toLowerCase().contains("movie") || current.group.contains("افلام")) ? movieData : liveData;
                          if (!target.containsKey(current.group)) target.put(current.group, new ArrayList<>());
                          target.get(current.group).add(current);
                          current = null;
                      }
                  }
              }

              private void switchMode(String mode) {
                  currentMode = mode;
                  Map<String, List<Item>> data = mode.equals("live") ? liveData : movieData;
                  List<String> groups = new ArrayList<>(data.keySet());
                  rvGroups.setAdapter(new GroupAdapter(groups));
              }

              class GroupAdapter extends RecyclerView.Adapter<GroupAdapter.VH> {
                  List<String> g; GroupAdapter(List<String> g) { this.g = g; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) {
                      Button b = new Button(p.getContext()); b.setTextColor(0xFFFFFFFF); b.setBackgroundColor(0x00000000);
                      return new VH(b);
                  }
                  @Override public void onBindViewHolder(VH h, int i) {
                      h.b.setText(g.get(i));
                      h.b.setOnClickListener(v -> {
                          Map<String, List<Item>> data = currentMode.equals("live") ? liveData : movieData;
                          rvItems.setAdapter(new ItemAdapter(data.get(g.get(i))));
                      });
                  }
                  @Override public int getItemCount() { return g.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v) { super(v); b = (Button)v; } }
              }

              class ItemAdapter extends RecyclerView.Adapter<ItemAdapter.VH> {
                  List<Item> items; ItemAdapter(List<Item> items) { this.items = items; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) {
                      TextView tv = new TextView(p.getContext()); tv.setPadding(20,20,20,20); tv.setTextColor(0xFFFFFFFF);
                      return new VH(tv);
                  }
                  @Override public void onBindViewHolder(VH h, int i) {
                      h.tv.setText(items.get(i).name);
                      h.tv.setOnClickListener(v -> {
                          txtTitle.setText(items.get(i).name);
                          txtGroup.setText("القسم: " + items.get(i).group);
                          player.setMediaItem(MediaItem.fromUri(items.get(i).url));
                          player.prepare(); player.play();
                      });
                  }
                  @Override public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView tv; VH(View v) { super(v); tv = (TextView)v; } }
              }
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_Final_APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabie_Professional_IPTV
          path: app/build/outputs/apk/debug/*.apk
