name: Rabie_Ultimate_Universal_Player
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Everything_Fixed
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # واجهة 3 أعمدة احترافية
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#0a0714">
              <LinearLayout android:layout_width="match_parent" android:layout_height="50dp"
                  android:orientation="horizontal" android:gravity="center_vertical" android:padding="10dp" android:background="#000">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" 
                      android:text="RABIE-TV PRO" android:textColor="#ff9100" android:textStyle="bold"/>
                  <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                  <Button android:id="@+id/btn_live" android:layout_width="wrap_content" android:layout_height="35dp" android:text="القنوات" android:textSize="9sp" android:backgroundTint="#1c142e"/>
                  <Button android:id="@+id/btn_movies" android:layout_width="wrap_content" android:layout_height="35dp" android:text="الأفلام" android:textSize="9sp" android:backgroundTint="#1c142e" android:layout_marginLeft="4dp"/>
                  <Button android:id="@+id/btn_series" android:layout_width="wrap_content" android:layout_height="35dp" android:text="المسلسلات" android:textSize="9sp" android:backgroundTint="#1c142e" android:layout_marginLeft="4dp"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.22" android:background="#1c142e"/>
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.28" android:background="#130d21"/>
                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.5" android:orientation="vertical">
                      <androidx.media3.ui.PlayerView android:id="@+id/exoplayer_view" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"/>
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="15dp" android:background="#1c142e" android:orientation="vertical">
                          <TextView android:id="@+id/txt_title" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="اختر محتوى" android:textColor="#ff9100" android:textSize="16sp" android:textStyle="bold"/>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
          </LinearLayout>
          EOF

          # كود الجافا لدعم HLS وتقسيم المسلسلات
          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private Map<String, List<Ch>> live = new LinkedHashMap<>(), movies = new LinkedHashMap<>(), series = new LinkedHashMap<>();
              private RecyclerView rvG, rvI;
              private TextView tTitle;
              class Ch { String n, u, g; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  player = new ExoPlayer.Builder(this).build();
                  ((PlayerView)findViewById(R.id.exoplayer_view)).setPlayer(player);
                  rvG = findViewById(R.id.rv_groups); rvI = findViewById(R.id.rv_items);
                  tTitle = findViewById(R.id.txt_title);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));

                  loadData();
                  findViewById(R.id.btn_live).setOnClickListener(v -> setMode(live));
                  findViewById(R.id.btn_movies).setOnClickListener(v -> setMode(movies));
                  findViewById(R.id.btn_series).setOnClickListener(v -> setMode(series));
              }

              private void loadData() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> { parse(res); setMode(live); }, null));
              }

              private void parse(String text) {
                  String[] lines = text.split("\n"); Ch cur = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          cur = new Ch(); cur.n = l.split(",")[1].trim();
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "General";
                      } else if (l.startsWith("http") && cur != null) {
                          cur.u = l.trim();
                          String gL = cur.g.toLowerCase();
                          Map<String, List<Ch>> target = gL.contains("movie") ? movies : (gL.contains("series") ? series : live);
                          if (!target.containsKey(cur.g)) target.put(cur.g, new ArrayList<>());
                          target.get(cur.g).add(cur); cur = null;
                      }
                  }
              }

              private void setMode(Map<String, List<Ch>> data) {
                  rvG.setAdapter(new GroupAdapter(new ArrayList<>(data.keySet()), data));
              }

              class GroupAdapter extends RecyclerView.Adapter<GroupAdapter.VH> {
                  List<String> groups; Map<String, List<Ch>> data;
                  GroupAdapter(List<String> g, Map<String, List<Ch>> d) { groups = g; data = d; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) {
                      Button b = new Button(p.getContext()); b.setTextColor(0xFFFFFFFF); b.setBackgroundColor(0); b.setAllCaps(false);
                      return new VH(b);
                  }
                  @Override public void onBindViewHolder(VH h, int i) {
                      h.b.setText(groups.get(i));
                      h.b.setOnClickListener(v -> rvI.setAdapter(new ItemAdapter(data.get(groups.get(i)))));
                  }
                  @Override public int getItemCount() { return groups.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v) { super(v); b = (Button)v; } }
              }

              class ItemAdapter extends RecyclerView.Adapter<ItemAdapter.VH> {
                  List<Ch> items; ItemAdapter(List<Ch> i) { items = i; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) {
                      TextView tv = new TextView(p.getContext()); tv.setPadding(25,25,25,25); tv.setTextColor(0xFFFFFFFF);
                      return new VH(tv);
                  }
                  @Override public void onBindViewHolder(VH h, int i) {
                      h.tv.setText(items.get(i).n);
                      h.tv.setOnClickListener(v -> {
                          tTitle.setText(items.get(i).n);
                          MediaItem mi = new MediaItem.Builder().setUri(items.get(i).u).build();
                          player.setMediaItem(mi); player.prepare(); player.play();
                      });
                  }
                  @Override public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView tv; VH(View v) { super(v); tv = (TextView)v; } }
              }
          }
          EOF

          # دعم كافة الصيغ (HLS + Dash + HTTP)
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-dash:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_APK
        uses: actions/upload-artifact@v4
        with: { name: Rabie_Ultimate_Universal_APK, path: app/build/outputs/apk/debug/*.apk }
