name: Rabie_Pro_V22_Fix
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_V22
        run: |
          # 1. تنظيف وبناء الهيكل بشكل صحيح
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          # 2. إنشاء ملف Manifest (الإصلاح الجوهري للخطأ)
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config" android:label="Rabie Pro V22" android:icon="@android:drawable/btn_star"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="orientation|screenSize"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

          # 3. إعدادات Gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          # 4. بناء دالة التحميل القوية واجهة المستخدم
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; versionCode 22; versionName "22.0" } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF

          # 5. واجهة المستخدم (Layout) - بدون إطارات مع شريط تحكم
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#050505">
              
              <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.6" android:orientation="vertical" android:padding="5dp">
                      <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:background="#000">
                          <androidx.media3.ui.PlayerView android:id="@+id/small_player" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="false"/>
                          <ProgressBar android:id="@+id/loading_s" android:layout_width="50dp" android:layout_height="50dp" android:layout_gravity="center" android:visibility="gone" android:indeterminateTint="#ff9100"/>
                      </FrameLayout>
                      <TextView android:id="@+id/txt_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#ff9100" android:gravity="center" android:padding="5dp" android:textStyle="bold"/>
                  </LinearLayout>

                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.4" android:orientation="vertical" android:background="#0A0A0A">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="5dp">
                          <Button android:id="@+id/tab_live" android:layout_width="0dp" android:layout_weight="1" android:layout_height="40dp" android:text="قنوات" android:backgroundTint="#ff9100" android:textColor="#000"/>
                          <Button android:id="@+id/tab_movie" android:layout_width="0dp" android:layout_weight="1" android:layout_height="40dp" android:text="أفلام" android:backgroundTint="#111" android:textColor="#FFF"/>
                      </LinearLayout>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="match_parent" android:layout_height="match_parent"/>
                  </LinearLayout>
              </LinearLayout>

              <FrameLayout android:id="@+id/full_container" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone">
                  <androidx.media3.ui.PlayerView android:id="@+id/full_player" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="false"/>
                  <RelativeLayout android:id="@+id/overlay" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#99000000" android:visibility="gone">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_alignParentBottom="true" android:orientation="vertical" android:padding="30dp">
                          <SeekBar android:id="@+id/seekbar" android:layout_width="match_parent" android:layout_height="wrap_content" android:progressTint="#ff9100" android:thumbTint="#ff9100"/>
                          <TextView android:id="@+id/time" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFF" android:layout_gravity="center"/>
                      </LinearLayout>
                  </RelativeLayout>
              </FrameLayout>
          </RelativeLayout>
          EOF

          # 6. الكود البرمجي (MainActivity)
          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.*;
          import androidx.media3.ui.PlayerView;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private View overlay, fullCont;
              private SeekBar sb;
              private Handler h = new Handler();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  // دالة تحميل قوية لمنع التجمد
                  DefaultLoadControl lc = new DefaultLoadControl.Builder().setBufferMs(15000, 50000, 2500, 5000).build();
                  player = new ExoPlayer.Builder(this).setLoadControl(lc).build();
                  
                  overlay = findViewById(R.id.overlay);
                  fullCont = findViewById(R.id.full_container);
                  sb = findViewById(R.id.seekbar);

                  // ربط OK واللمس لإظهار الشريط
                  findViewById(R.id.full_player).setOnClickListener(v -> toggleOverlay());
                  
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar s, int p, boolean f) { if(f) player.seekTo(p); }
                      @Override public void onStartTrackingTouch(SeekBar s) {}
                      @Override public void onStopTrackingTouch(SeekBar s) {}
                  });
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER) {
                      toggleOverlay(); return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              private void toggleOverlay() {
                  overlay.setVisibility(View.VISIBLE);
                  sb.setMax((int)player.getDuration());
                  sb.setProgress((int)player.getCurrentPosition());
                  h.removeCallbacksAndMessages(null);
                  h.postDelayed(() -> overlay.setVisibility(View.GONE), 5000);
              }
          }
          EOF

          # 7. الأوامر النهائية لبناء الـ APK
          echo '<?xml version="1.0" encoding="utf-8"?><network-security-config><base-config cleartextTrafficPermitted="true"/></network-security-config>' > app/src/main/res/xml/network_security_config.xml
          gradle wrapper --gradle-version 8.5
          ./gradlew :app:assembleDebug
