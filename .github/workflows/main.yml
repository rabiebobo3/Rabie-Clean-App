name: Rabie_Success_Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Pure_APK
        run: |
          # صنع مجلدات المشروع
          mkdir -p app/src/main/java/com/rabie/cleanapp
          
          # إعدادات Gradle
          echo "include ':app'" > settings.gradle
          
          # ملف بناء التطبيق
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android {
              namespace 'com.rabie.cleanapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.rabie.cleanapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          # المانيفست
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Rabie Success"><activity android:name="com.rabie.cleanapp.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          # كود الجافا
          echo 'package com.rabie.cleanapp; import android.app.Activity; import android.os.Bundle; public class MainActivity extends Activity { @Override protected void onCreate(Bundle s) { super.onCreate(s); android.widget.TextView t = new android.widget.TextView(this); t.setText("Success! ✅"); setContentView(t); } }' > app/src/main/java/com/rabie/cleanapp/MainActivity.java
          
          # أمر البناء
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_Result
        uses: actions/upload-artifact@v4
        with:
          name: My_First_Success_APK
          path: app/build/outputs/apk/debug/*.apk
