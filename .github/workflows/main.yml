name: Rabie_Native_ExoPlayer_Pro
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Advanced_ExoPlayer_App
        run: |
          # 1. تنظيف شامل لضمان نجاح البناء بنسبة 100%
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/nativeiptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 2. ألوان الواجهة البنفسجية (Style HTML)
          cat <<EOF > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#0a0714</color>
              <color name="panel_dark">#1c142e</color>
              <color name="accent_orange">#ff9100</color>
              <color name="item_active">#2d2445</color>
          </resources>
          EOF

          # 3. واجهة XML (تقسيم ثلاثي مع مشغل ExoPlayer)
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="horizontal" android:background="@color/bg_dark">
              
              <LinearLayout android:layout_width="150dp" android:layout_height="match_parent"
                  android:orientation="vertical" android:background="@color/panel_dark" android:padding="10dp">
                  <Button android:layout_width="match_parent" android:layout_height="wrap_content" android:text="LIVE" android:backgroundTint="@color/item_active" android:textSize="12sp"/>
                  <Button android:layout_width="match_parent" android:layout_height="wrap_content" android:text="MOVIES" android:backgroundTint="@color/item_active" android:textSize="12sp"/>
                  <Button android:layout_width="match_parent" android:layout_height="wrap_content" android:text="SERIES" android:backgroundTint="@color/item_active" android:textSize="12sp"/>
              </LinearLayout>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rv_list"
                  android:layout_width="250dp" android:layout_height="match_parent"
                  android:background="#130d21" />

              <LinearLayout android:layout_width="0dp" android:layout_height="match_parent"
                  android:layout_weight="1" android:orientation="vertical">
                  
                  <androidx.media3.ui.PlayerView
                      android:id="@+id/exoplayer_view"
                      android:layout_width="match_parent" android:layout_height="0dp"
                      android:layout_weight="1" android:background="#000000" />
                  
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:padding="15dp" android:background="@color/panel_dark" android:orientation="vertical">
                      <TextView android:id="@+id/txt_title" android:layout_width="wrap_content" android:layout_height="wrap_content" 
                          android:text="RABIE PRO PLAYER" android:textColor="@color/accent_orange" android:textSize="18sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" 
                          android:text="ExoPlayer Engine v3.0" android:textColor="#888" android:textSize="11sp"/>
                  </LinearLayout>
              </LinearLayout>
          </LinearLayout>
          EOF

          # 4. كود الجافا (برمجة المشغل ExoPlayer)
          cat <<EOF > app/src/main/java/com/rabie/nativeiptv/MainActivity.java
          package com.rabie.nativeiptv;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  PlayerView playerView = findViewById(R.id.exoplayer_view);
                  
                  // بناء المشغل مع دعم كامل لمفاتيح التحكم (Media Controls)
                  player = new ExoPlayer.Builder(this).build();
                  playerView.setPlayer(player);

                  // تشغيل دفق تجريبي (يدعم التقديم والتأخير)
                  MediaItem mediaItem = MediaItem.fromUri("https://html5ext.com/static/video/trailer.mp4");
                  player.setMediaItem(mediaItem);
                  player.prepare();
                  player.play();
              }

              @Override
              protected void onStop() { super.onStop(); if (player != null) player.pause(); }
              @Override
              protected void onDestroy() { super.onDestroy(); if (player != null) player.release(); }
          }
          EOF

          # 5. ملف البناء والاعتمادات
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android {
              namespace 'com.rabie.nativeiptv'
              compileSdk 34
              defaultConfig { applicationId "com.rabie.nativeiptv"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0-Exo" }
          }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:label="Rabie IPTV Pro"><activity android:name="com.rabie.nativeiptv.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Download_Success_APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabie_Professional_ExoPlayer
          path: app/build/outputs/apk/debug/*.apk
