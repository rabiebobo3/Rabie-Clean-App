name: Rabie_Ibo_Real_Style_V41
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Ibo_Pro_Edition
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # ألوان إيبو بلاير الأصلية من صورك
          cat <<EOF > app/src/main/res/values/colors.xml
          <resources>
              <color name="ibo_bg">#0A0A1A</color>
              <color name="ibo_card">#16162E</color>
              <color name="ibo_accent">#F2994A</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          # واجهة الـ Dashboard (كما الصورة 1000048568)
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0A0A1A">
              
              <LinearLayout android:id="@+id/dash" android:layout_width="match_parent" android:layout_height="match_parent" 
                  android:orientation="vertical" android:gravity="center" android:padding="20dp">
                  <ImageView android:layout_width="100dp" android:layout_height="100dp" android:src="@android:drawable/ic_menu_slideshow" android:layout_marginBottom="20dp"/>
                  <GridLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:columnCount="3" android:rowCount="1">
                      <androidx.cardview.widget.CardView android:id="@+id/btn_live" android:layout_width="150dp" android:layout_height="150dp" android:layout_margin="10dp" app:cardBackgroundColor="#16162E" app:cardCornerRadius="20dp">
                          <TextView android:layout_width="match_parent" android:layout_height="match_parent" android:text="بث مباشر" android:textColor="#FFF" android:gravity="center" android:textStyle="bold"/>
                      </androidx.cardview.widget.CardView>
                      <androidx.cardview.widget.CardView android:id="@+id/btn_vod" android:layout_width="150dp" android:layout_height="150dp" android:layout_margin="10dp" app:cardBackgroundColor="#16162E" app:cardCornerRadius="20dp">
                          <TextView android:layout_width="match_parent" android:layout_height="match_parent" android:text="أفلام" android:textColor="#FFF" android:gravity="center" android:textStyle="bold"/>
                      </androidx.cardview.widget.CardView>
                      <androidx.cardview.widget.CardView android:id="@+id/btn_ser" android:layout_width="150dp" android:layout_height="150dp" android:layout_margin="10dp" app:cardBackgroundColor="#16162E" app:cardCornerRadius="20dp">
                          <TextView android:layout_width="match_parent" android:layout_height="match_parent" android:text="مسلسلات" android:textColor="#FFF" android:gravity="center" android:textStyle="bold"/>
                      </androidx.cardview.widget.CardView>
                  </GridLayout>
              </LinearLayout>

              <LinearLayout android:id="@+id/ibo_layout" android:layout_width="match_parent" android:layout_height="match_parent" 
                  android:orientation="horizontal" android:visibility="gone">
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_g" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.2" android:background="#16162E"/>
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_i" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.3" android:background="#0F0F1F"/>
                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.5" android:orientation="vertical">
                      <androidx.media3.ui.PlayerView android:id="@+id/pv" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="true"/>
                  </LinearLayout>
              </LinearLayout>
          </RelativeLayout>
          EOF

          # كود الجافا لدعم النظام الجديد
          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private View dash, iboLayout;
              private RecyclerView rvG, rvI;
              private Map<String, List<String[]>> liveData = new LinkedHashMap<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  player = new ExoPlayer.Builder(this).build();
                  ((PlayerView)findViewById(R.id.pv)).setPlayer(player);
                  dash = findViewById(R.id.dash); iboLayout = findViewById(R.id.ibo_layout);
                  rvG = findViewById(R.id.rv_g); rvI = findViewById(R.id.rv_i);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));

                  loadM3u();
                  findViewById(R.id.btn_live).setOnClickListener(v -> { dash.setVisibility(View.GONE); iboLayout.setVisibility(View.VISIBLE); });
              }

              private void loadM3u() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> {
                      parse(res);
                      rvG.setAdapter(new GAdapter(new ArrayList<>(liveData.keySet())));
                  }, null));
              }

              private void parse(String text) {
                  String[] lines = text.split("\n"); String n="", g="", u="";
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          n = l.split(",")[1].trim();
                          g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "TV";
                      } else if (l.startsWith("http")) {
                          u = l.trim();
                          if(!liveData.containsKey(g)) liveData.get(g).add(new ArrayList<>()); // Simplified logic
                          liveData.computeIfAbsent(g, k -> new ArrayList<>()).add(new String[]{n, u});
                      }
                  }
              }

              @Override public void onBackPressed() {
                  if (iboLayout.getVisibility() == View.VISIBLE) { iboLayout.setVisibility(View.GONE); dash.setVisibility(View.VISIBLE); player.stop(); }
                  else super.onBackPressed();
              }

              class GAdapter extends RecyclerView.Adapter<GAdapter.VH> {
                  List<String> groups; GAdapter(List<String> g){ groups=g; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { Button b=new Button(p.getContext()); b.setTextColor(-1); b.setBackgroundColor(0); return new VH(b); }
                  @Override public void onBindViewHolder(VH h, int i) { h.b.setText(groups.get(i)); h.b.setOnClickListener(v -> rvI.setAdapter(new IAdapter(liveData.get(groups.get(i))))); }
                  @Override public int getItemCount() { return groups.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v){ super(v); b=(Button)v; } }
              }

              class IAdapter extends RecyclerView.Adapter<IAdapter.VH> {
                  List<String[]> items; IAdapter(List<String[]> i){ items=i; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) { TextView tv=new TextView(p.getContext()); tv.setTextColor(-1); tv.setPadding(20,30,20,30); return new VH(tv); }
                  @Override public void onBindViewHolder(VH h, int i) { h.tv.setText(items.get(i)[0]); h.tv.setOnClickListener(v -> { player.setMediaItem(MediaItem.fromUri(items.get(i)[1])); player.prepare(); player.play(); }); }
                  @Override public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView tv; VH(View v){ super(v); tv=(TextView)v; } }
              }
          }
          EOF

          # تصحيح الـ Gradle لمطابقة صور الخطأ في GitHub
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'com.android.volley:volley:1.2.1'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:label="IBO PRO"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_Ibo_Style_APK
        uses: actions/upload-artifact@v4
        with: { name: Ibo_Real_Style_V41, path: app/build/outputs/apk/debug/*.apk }
