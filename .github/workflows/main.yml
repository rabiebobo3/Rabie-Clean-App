name: Rabie_Pro_V16_Fixed_Player
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_V16_Final
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          # 1. واجهة المشغل الصغير والكبير (Player Views)
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" 
              android:background="#0a0714">
              
              <LinearLayout android:id="@+id/main_ui_container" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="#000" android:gravity="center_vertical" android:padding="8dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO" android:textColor="#ff9100" android:textSize="20sp" android:textStyle="bold"/>
                      <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                      <Button android:id="@+id/tab_live" android:layout_width="wrap_content" android:layout_height="40dp" android:text="قنوات" android:backgroundTint="#1c142e" android:background="@drawable/focus_highlight" android:focusable="true"/>
                      <Button android:id="@+id/tab_fav" android:layout_width="wrap_content" android:layout_height="40dp" android:text="⭐" android:backgroundTint="#1c142e" android:layout_marginLeft="5dp" android:focusable="true"/>
                      <Button android:id="@+id/btn_toggle_fav" android:layout_width="wrap_content" android:layout_height="40dp" android:text="+/-" android:backgroundTint="#ff9100" android:layout_marginLeft="10dp" android:focusable="true"/>
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.4" android:background="#130d21"/>
                      <FrameLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.6">
                          <androidx.media3.ui.PlayerView android:id="@+id/small_player" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000" app:use_controller="false" app:resize_mode="fill"/>
                          <ProgressBar android:id="@+id/loader_small" android:layout_width="50dp" android:layout_height="50dp" android:layout_gravity="center" android:visibility="gone" android:indeterminateTint="#ff9100"/>
                      </FrameLayout>
                  </LinearLayout>
              </LinearLayout>

              <FrameLayout android:id="@+id/full_player_container" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:background="#000">
                  <androidx.media3.ui.PlayerView android:id="@+id/full_player" android:layout_width="match_parent" android:layout_height="match_parent" app:resize_mode="fill"/>
                  <ProgressBar android:id="@+id/loader_full" android:layout_width="80dp" android:layout_height="80dp" android:layout_gravity="center" android:visibility="gone" android:indeterminateTint="#ff9100"/>
              </FrameLayout>

              <RelativeLayout android:id="@+id/splash_screen" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0a0714" android:elevation="50dp">
                  <ProgressBar android:layout_width="60dp" android:layout_height="60dp" android:layout_centerInParent="true" android:indeterminateTint="#ff9100"/>
              </RelativeLayout>
          </RelativeLayout>
          EOF

          cat <<EOF > app/src/main/res/layout/item_channel.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:padding="10dp" android:focusable="true" android:background="@drawable/focus_highlight">
              <ImageView android:id="@+id/img_logo" android:layout_width="40dp" android:layout_height="40dp" android:layout_marginRight="10dp"/>
              <TextView android:id="@+id/txt_name" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFF" android:textSize="16sp"/>
          </LinearLayout>
          EOF

          cat <<EOF > app/src/main/res/drawable/focus_highlight.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true"><shape><solid android:color="#ff9100"/><corners android:radius="5dp"/></shape></item>
              <item><shape><solid android:color="@android:color/transparent"/></shape></item>
          </selector>
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { 
              namespace 'com.rabie.iptv'
              compileSdk 34
              defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; versionCode 16; versionName "16.5" }
          }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF

          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import com.bumptech.glide.Glide;
          import com.google.gson.Gson;
          import com.google.gson.reflect.TypeToken;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private List<Ch> list = new ArrayList<>(), favs = new ArrayList<>();
              private Ch current;
              private PlayerView smallPV, fullPV;
              private View mainUI, fullCont;
              private ProgressBar loadS, loadF;

              static class Ch { String n, u, l; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  new Handler().postDelayed(() -> findViewById(R.id.splash_screen).setVisibility(View.GONE), 3000);

                  player = new ExoPlayer.Builder(this).build();
                  smallPV = findViewById(R.id.small_player); fullPV = findViewById(R.id.full_player);
                  mainUI = findViewById(R.id.main_ui_container); fullCont = findViewById(R.id.full_player_container);
                  loadS = findViewById(R.id.loader_small); loadF = findViewById(R.id.loader_full);
                  smallPV.setPlayer(player);

                  player.addListener(new Player.Listener() {
                      @Override public void onPlaybackStateChanged(int s) {
                          int v = (s == Player.STATE_BUFFERING) ? View.VISIBLE : View.GONE;
                          loadS.setVisibility(v); loadF.setVisibility(v);
                      }
                  });

                  RecyclerView rv = findViewById(R.id.rv_items);
                  rv.setLayoutManager(new LinearLayoutManager(this));

                  loadFavs();
                  Volley.newRequestQueue(this).add(new StringRequest("https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u", res -> {
                      parse(res); rv.setAdapter(new ItemAdapter(list));
                  }, null));

                  findViewById(R.id.tab_fav).setOnClickListener(v -> rv.setAdapter(new ItemAdapter(favs)));
                  findViewById(R.id.tab_live).setOnClickListener(v -> rv.setAdapter(new ItemAdapter(list)));
                  findViewById(R.id.btn_toggle_fav).setOnClickListener(v -> toggleFav());
                  fullPV.setOnClickListener(v -> toggleFull(false));
              }

              private void parse(String t) {
                  String[] lines = t.split("\n"); Ch c = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) { c = new Ch(); c.n = l.split(",")[1].trim(); c.l = l.contains("logo=\"") ? l.split("logo=\"")[1].split("\"")[0] : ""; }
                      else if (l.startsWith("http") && c != null) { c.u = l.trim(); list.add(c); c = null; }
                  }
              }

              private void toggleFull(boolean f) {
                  fullCont.setVisibility(f ? View.VISIBLE : View.GONE);
                  mainUI.setVisibility(f ? View.GONE : View.VISIBLE);
                  PlayerView.switchTargetView(player, f ? smallPV : fullPV, f ? fullPV : smallPV);
              }

              private void toggleFav() {
                  if (current == null) return;
                  boolean has = false; for(Ch f : favs) if(f.u.equals(current.u)) has = true;
                  if (has) favs.removeIf(f -> f.u.equals(current.u)); else favs.add(current);
                  getSharedPreferences("p", 0).edit().putString("f", new Gson().toJson(favs)).apply();
              }

              private void loadFavs() {
                  String j = getSharedPreferences("p", 0).getString("f", "[]");
                  favs = new Gson().fromJson(j, new TypeToken<List<Ch>>(){}.getType());
              }

              class ItemAdapter extends RecyclerView.Adapter<ItemAdapter.VH> {
                  List<Ch> items; ItemAdapter(List<Ch> i) { items = i; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { return new VH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_channel, p, false)); }
                  public void onBindViewHolder(VH h, int i) {
                      Ch c = items.get(i); h.n.setText(c.n); Glide.with(h.itemView).load(c.l).into(h.img);
                      GestureDetector gd = new GestureDetector(h.itemView.getContext(), new GestureDetector.SimpleOnGestureListener() {
                          @Override public boolean onSingleTapConfirmed(MotionEvent e) { current = c; player.setMediaItem(MediaItem.fromUri(c.u)); player.prepare(); player.play(); return true; }
                          @Override public boolean onDoubleTap(MotionEvent e) { toggleFull(true); return true; }
                      });
                      h.itemView.setOnTouchListener((v, event) -> gd.onTouchEvent(event));
                  }
                  public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView n; ImageView img; VH(View v) { super(v); n = v.findViewById(R.id.txt_name); img = v.findViewById(R.id.img_logo); } }
              }
          }
          EOF

          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:label="Rabie Pro" android:icon="@android:drawable/btn_star"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_APK
        uses: actions/upload-artifact@v4
        with: { name: Rabie_Pro_V16_Fixed, path: app/build/outputs/apk/debug/*.apk }
