name: Rabie_Pro_V15_Fixed_System
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Ultimate_V15
        run: |
          # تنظيف البيئة لضمان عدم تكرار أخطاء المسارات
          rm -rf app settings.gradle build.gradle gradle.properties
          
          echo "android.useAndroidX=true" > gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          # واجهة العرض الرئيسية
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" 
              android:background="#0a0714" android:keepScreenOn="true">
              
              <LinearLayout android:id="@+id/main_ui_container" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="#000" android:gravity="center_vertical" android:padding="8dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO" android:textColor="#ff9100" android:textStyle="bold" android:textSize="18sp"/>
                      <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                      <Button android:id="@+id/tab_live" android:layout_width="wrap_content" android:layout_height="40dp" android:text="القنوات" android:focusable="true" android:background="@drawable/focus_highlight"/>
                      <Button android:id="@+id/tab_movie" android:layout_width="wrap_content" android:layout_height="40dp" android:text="الأفلام" android:layout_marginLeft="5dp" android:focusable="true" android:background="@drawable/focus_highlight"/>
                      <Button android:id="@+id/tab_series" android:layout_width="wrap_content" android:layout_height="40dp" android:text="المسلسلات" android:layout_marginLeft="5dp" android:focusable="true" android:background="@drawable/focus_highlight"/>
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.25" android:background="#1c142e"/>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.30" android:background="#130d21"/>
                      <FrameLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.45">
                          <androidx.media3.ui.PlayerView android:id="@+id/small_player" android:layout_width="match_parent" android:layout_height="250dp" android:layout_gravity="top" app:use_controller="false"/>
                          <TextView android:id="@+id/txt_current_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="260dp" android:padding="10dp" android:text="اختر قناة" android:textColor="#ff9100" android:textSize="18sp" android:textStyle="bold"/>
                      </FrameLayout>
                  </LinearLayout>
              </LinearLayout>

              <FrameLayout android:id="@+id/full_container" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:background="#000">
                  <androidx.media3.ui.PlayerView android:id="@+id/full_player" android:layout_width="match_parent" android:layout_height="match_parent" app:resize_mode="fill" app:use_controller="true" />
              </FrameLayout>
          </RelativeLayout>
          EOF

          # تصميم القناة الواحدة (لحل مشكلة txt_name و img_logo)
          cat <<EOF > app/src/main/res/layout/item_channel.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="horizontal" android:padding="10dp" android:focusable="true" android:background="@drawable/focus_highlight">
              <ImageView android:id="@+id/img_logo" android:layout_width="40dp" android:layout_height="40dp" android:layout_marginRight="10dp"/>
              <TextView android:id="@+id/txt_name" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFF" android:textSize="14sp"/>
          </LinearLayout>
          EOF

          cat <<EOF > app/src/main/res/drawable/focus_highlight.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true"><shape><solid android:color="#44ff9100"/><stroke android:width="2dp" android:color="#ff9100"/></shape></item>
              <item><shape><solid android:color="@android:color/transparent"/></shape></item>
          </selector>
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { 
              namespace 'com.rabie.iptv'
              compileSdk 34
              defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; versionCode 15; versionName "15.0" }
          }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF

          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import com.bumptech.glide.Glide;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private Map<String, List<Ch>> live = new LinkedHashMap<>();
              private RecyclerView rvG, rvI;
              private PlayerView smallPV, fullPV;
              private View mainUI, fullCont;
              private TextView tTitle;

              static class Ch { String n, u, g, l; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  player = new ExoPlayer.Builder(this).build();
                  smallPV = findViewById(R.id.small_player); fullPV = findViewById(R.id.full_player);
                  mainUI = findViewById(R.id.main_ui_container); fullCont = findViewById(R.id.full_container);
                  tTitle = findViewById(R.id.txt_current_title);
                  smallPV.setPlayer(player);

                  rvG = findViewById(R.id.rv_groups); rvI = findViewById(R.id.rv_items);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));

                  loadData();
                  
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override public void handleOnBackPressed() {
                          if (fullCont.getVisibility() == View.VISIBLE) toggleFull(false); else finish();
                      }
                  });

                  findViewById(R.id.tab_live).setOnClickListener(v -> setMode());
              }

              @Override protected void onStop() { super.onStop(); if(player != null) player.stop(); }
              @Override protected void onDestroy() { super.onDestroy(); if(player != null) player.release(); }

              private void toggleFull(boolean full) {
                  if (full) {
                      mainUI.setVisibility(View.GONE); fullCont.setVisibility(View.VISIBLE);
                      PlayerView.switchTargetView(player, smallPV, fullPV);
                  } else {
                      fullCont.setVisibility(View.GONE); mainUI.setVisibility(View.VISIBLE);
                      PlayerView.switchTargetView(player, fullPV, smallPV);
                  }
              }

              private void loadData() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> { 
                      parse(res); setMode(); 
                  }, null));
              }

              private void parse(String text) {
                  String[] lines = text.split("\n"); Ch cur = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          cur = new Ch();
                          cur.n = l.split(",").length > 1 ? l.split(",")[1].trim() : "Unknown";
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "Other";
                          cur.l = l.contains("tvg-logo=\"") ? l.split("tvg-logo=\"")[1].split("\"")[0] : "";
                      } else if (l.startsWith("http") && cur != null) {
                          cur.u = l.trim();
                          if (!live.containsKey(cur.g)) live.put(cur.g, new ArrayList<>());
                          live.get(cur.g).add(cur); cur = null;
                      }
                  }
              }

              private void setMode() {
                  rvG.setAdapter(new GroupAdapter(new ArrayList<>(live.keySet())));
              }

              class GroupAdapter extends RecyclerView.Adapter<GroupAdapter.VH> {
                  List<String> groups;
                  GroupAdapter(List<String> g) { this.groups = g; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { 
                      Button b = new Button(p.getContext()); b.setFocusable(true); b.setBackgroundResource(R.drawable.focus_highlight); return new VH(b); 
                  }
                  public void onBindViewHolder(VH h, int i) { 
                      h.b.setText(groups.get(i)); 
                      h.b.setOnClickListener(v -> rvI.setAdapter(new ItemAdapter(live.get(groups.get(i))))); 
                  }
                  public int getItemCount() { return groups.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v) { super(v); b = (Button)v; } }
              }

              class ItemAdapter extends RecyclerView.Adapter<ItemAdapter.VH> {
                  List<Ch> items;
                  ItemAdapter(List<Ch> i) { items = i; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { return new VH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_channel, p, false)); }
                  public void onBindViewHolder(VH h, int i) {
                      Ch c = items.get(i); h.n.setText(c.n); Glide.with(h.itemView).load(c.l).into(h.img);
                      h.itemView.setOnClickListener(v -> { 
                          tTitle.setText(c.n); player.setMediaItem(MediaItem.fromUri(c.u)); player.prepare(); player.play();
                      });
                      h.itemView.setOnLongClickListener(v -> { toggleFull(true); return true; });
                  }
                  public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { 
                      TextView n; ImageView img; 
                      VH(View v) { super(v); n = v.findViewById(R.id.txt_name); img = v.findViewById(R.id.img_logo); } 
                  }
              }
          }
          EOF

          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:label="Rabie Pro V15"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_APK
        uses: actions/upload-artifact@v4
        with: { name: Rabie_Pro_V15_Fixed, path: app/build/outputs/apk/debug/*.apk }
