name: Rabie_Pro_V40_Ultimate_Stable
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Reset and Structure Project
        run: |
          # تنظيف شامل للمجلدات لضمان عدم تداخل النسخ القديمة
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          
          # 1. إنشاء ملف الإعدادات
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          # 2. إنشاء ملف خصائص جرادل
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # 3. بناء هيكل المجلدات
          mkdir -p app/src/main/java/com/rabie/iptv app/src/main/res/layout app/src/main/res/drawable app/src/main/res/xml

          # 4. ملف build.gradle الرئيسي للتطبيق
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rabie.iptv'
              compileSdk 34
              defaultConfig {
                  applicationId "com.rabie.iptv"
                  minSdk 21
                  targetSdk 34
                  versionCode 40
                  versionName "40.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
          }
          EOF

          # 5. الكود البرمجي (MainActivity) مع إصلاحات التجمد والرجوع
          cat <<'EOF' > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AlertDialog;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.*;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.*;
          import com.android.volley.toolbox.*;
          import com.bumptech.glide.Glide;
          import com.google.gson.Gson;
          import com.google.gson.reflect.TypeToken;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private Map<String, List<Ch>> live = new LinkedHashMap<>(), movie = new LinkedHashMap<>();
              private Map<String, Map<String, List<Ch>>> series = new LinkedHashMap<>();
              private Map<String, String> groupLogos = new HashMap<>();
              private List<Ch> favList = new ArrayList<>(), currentItems = new ArrayList<>();
              private Ch currentCh;
              private RecyclerView rvG, rvI;
              private TextView tTitle, tTime, tFullChName;
              private PlayerView smallPV, fullPV;
              private View mainUI, fullCont, overlay, vodControls, splash;
              private SeekBar seekBar;
              private ProgressBar ps, pf;
              private ImageButton btnPP;
              private String currentMode = "live";
              private Handler handler = new Handler(Looper.getMainLooper());
              private long lastClickTime = 0, lastPos = -1;

              static class Ch { String n, u, g, l; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  splash = findViewById(R.id.splash_screen); mainUI = findViewById(R.id.main_ui_container);
                  handler.postDelayed(() -> { splash.setVisibility(View.GONE); mainUI.setVisibility(View.VISIBLE); }, 2000);

                  player = new ExoPlayer.Builder(this).build();
                  smallPV = findViewById(R.id.small_player); fullPV = findViewById(R.id.full_player);
                  fullCont = findViewById(R.id.full_container); overlay = findViewById(R.id.overlay_full);
                  tTime = findViewById(R.id.txt_time); seekBar = findViewById(R.id.full_seekbar);
                  tFullChName = findViewById(R.id.full_ch_name); vodControls = findViewById(R.id.vod_controls);
                  ps = findViewById(R.id.loading_s); pf = findViewById(R.id.loading_f);
                  btnPP = findViewById(R.id.btn_play_pause);
                  smallPV.setPlayer(player);

                  player.addListener(new Player.Listener() {
                      public void onPlaybackStateChanged(int s) {
                          int v = (s == Player.STATE_BUFFERING) ? View.VISIBLE : View.GONE;
                          ps.setVisibility(v); pf.setVisibility(v);
                      }
                  });

                  // حل مشكلة التجمد
                  handler.post(new Runnable() {
                      public void run() {
                          if (player != null && player.isPlaying()) {
                              long cur = player.getCurrentPosition();
                              if (cur == lastPos && player.getPlaybackState() != Player.STATE_ENDED) { ps.setVisibility(View.VISIBLE); }
                              else { ps.setVisibility(View.GONE); }
                              lastPos = cur;
                          }
                          handler.postDelayed(this, 2000);
                      }
                  });

                  fullCont.setOnClickListener(v -> { overlay.setVisibility(View.VISIBLE); handler.postDelayed(()-> overlay.setVisibility(View.GONE), 5000); });
                  
                  rvG = findViewById(R.id.rv_groups); rvI = findViewById(R.id.rv_items);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));

                  loadData();

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      public void handleOnBackPressed() { 
                          if (fullCont.getVisibility() == View.VISIBLE) {
                              fullCont.setVisibility(View.GONE); mainUI.setVisibility(View.VISIBLE);
                              PlayerView.switchTargetView(player, fullPV, smallPV);
                          } else { finish(); }
                      }
                  });
              }

              private void loadData() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(0, url, res -> { parse(res); setMode("live"); }, null));
              }

              private void setMode(String m) {
                  currentMode = m;
                  Map<String, List<Ch>> d = live;
                  List<String> gList = new ArrayList<>(d.keySet());
                  rvG.setAdapter(new GroupAdapter(gList, d));
              }

              private void parse(String text) {
                  String[] lines = text.split("\n"); Ch cur = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          cur = new Ch(); cur.n = l.split(",").length > 1 ? l.split(",")[1].trim() : "Channel";
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "General";
                      } else if (l.startsWith("http") && cur != null) {
                          cur.u = l.trim(); live.computeIfAbsent(cur.g, k->new ArrayList<>()).add(cur); cur = null;
                      }
                  }
              }

              class GroupAdapter extends RecyclerView.Adapter<GroupAdapter.VH> {
                  List<String> g; Map<String, List<Ch>> d;
                  GroupAdapter(List<String> g, Map<String, List<Ch>> d) { this.g = g; this.d = d; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { return new VH(LayoutInflater.from(p.getContext()).inflate(android.R.layout.simple_list_item_1, p, false)); }
                  public void onBindViewHolder(VH h, int i) {
                      h.t.setText(g.get(i)); h.t.setTextColor(0xFFFF9100);
                      h.itemView.setOnClickListener(v -> { currentItems = d.get(g.get(i)); rvI.setAdapter(new ItemAdapter(currentItems)); });
                  }
                  public int getItemCount() { return g.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView t; VH(View v) { super(v); t = v.findViewById(android.R.id.text1); } }
              }

              class ItemAdapter extends RecyclerView.Adapter<ItemAdapter.VH> {
                  List<Ch> items; ItemAdapter(List<Ch> i) { items = i; }
                  public VH onCreateViewHolder(ViewGroup p, int t) { return new VH(LayoutInflater.from(p.getContext()).inflate(android.R.layout.simple_list_item_1, p, false)); }
                  public void onBindViewHolder(VH h, int i) {
                      Ch c = items.get(i); h.t.setText(c.n); h.t.setTextColor(0xFFFFFFFF);
                      h.itemView.setOnClickListener(v -> {
                          long t = System.currentTimeMillis();
                          if (t - lastClickTime < 500) {
                              fullCont.setVisibility(View.VISIBLE); mainUI.setVisibility(View.GONE);
                              PlayerView.switchTargetView(player, smallPV, fullPV);
                          } else {
                              player.setMediaItem(MediaItem.fromUri(c.u)); player.prepare(); player.play();
                          }
                          lastClickTime = t;
                      });
                  }
                  public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView t; VH(View v) { super(v); t = v.findViewById(android.R.id.text1); } }
              }
          }
          EOF

          # 6. ملفات الموارد (XML) - الواجهة الأصلية نتاعك
          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0a0714">
              <LinearLayout android:id="@+id/splash_screen" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0a0714" android:gravity="center" android:elevation="20dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RABIE PRO" android:textColor="#ff9100" android:textSize="50sp" android:textStyle="bold"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/main_ui_container" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:orientation="vertical">
                          <FrameLayout android:layout_width="match_parent" android:layout_height="250dp">
                              <androidx.media3.ui.PlayerView android:id="@+id/small_player" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="false"/>
                              <ProgressBar android:id="@+id/loading_s" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:visibility="gone"/>
                          </FrameLayout>
                          <TextView android:id="@+id/txt_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#ff9100" android:padding="10dp" android:textSize="18sp"/>
                      </LinearLayout>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.7" android:background="#1c142e"/>
                  </LinearLayout>
              </LinearLayout>
              <FrameLayout android:id="@+id/full_container" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:background="#000">
                  <androidx.media3.ui.PlayerView android:id="@+id/full_player" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="false"/>
                  <ProgressBar android:id="@+id/loading_f" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:visibility="gone"/>
                  <RelativeLayout android:id="@+id/overlay_full" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:background="#80000000">
                      <TextView android:id="@+id/full_ch_name" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_centerInParent="true" android:textColor="#ff9100" android:textSize="24sp"/>
                      <LinearLayout android:id="@+id/vod_controls" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_alignParentBottom="true" android:orientation="vertical" android:padding="20dp">
                          <SeekBar android:id="@+id/full_seekbar" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                          <TextView android:id="@+id/txt_time" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFF"/>
                          <ImageButton android:id="@+id/btn_play_pause" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:src="@android:drawable/ic_media_pause"/>
                      </LinearLayout>
                  </RelativeLayout>
              </FrameLayout>
          </RelativeLayout>
          EOF

          # 7. الـ Manifest والأذونات
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.rabie.iptv"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:label="Rabie Pro V40"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabie_Pro_V40_Success
          path: app/build/outputs/apk/debug/*.apk
