name: Rabie_TV_V25_Moudmon
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_Fix_V25
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat <<EOF > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#FF000000</color>
              <color name="orange_main">#ffff9100</color>
              <color name="dark_blue">#ff1c142e</color>
          </resources>
          EOF

          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#0a0714">
              <LinearLayout android:layout_width="match_parent" android:layout_height="55dp"
                  android:orientation="horizontal" android:gravity="center_vertical" android:padding="8dp" android:background="#000">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" 
                      android:text="RABIE PRO TV" android:textColor="#ff9100" android:textStyle="bold"/>
                  <Button android:id="@+id/btn_fav" android:layout_width="wrap_content" android:layout_height="35dp" 
                      android:text="المفضلة" android:textSize="9sp" android:layout_marginLeft="15dp" android:backgroundTint="#d32f2f"/>
                  <View android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"/>
                  <Button android:id="@+id/btn_refresh" android:layout_width="wrap_content" android:layout_height="35dp" android:text="تحديث" android:textSize="9sp"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_g" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.3" android:background="#1c142e"/>
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_i" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.3" android:background="#130d21"/>
                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.4" android:orientation="vertical">
                      <androidx.media3.ui.PlayerView android:id="@+id/pv" android:layout_width="match_parent" android:layout_height="220dp"/>
                      <TextView android:id="@+id/t_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="15dp" android:textColor="#ff9100" android:textStyle="bold" android:text="اختر قناة للبدء"/>
                  </LinearLayout>
              </LinearLayout>
          </LinearLayout>
          EOF

          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private Map<String, List<Ch>> liveMap = new LinkedHashMap<>();
              private List<Ch> favList = new ArrayList<>();
              private RecyclerView rvG, rvI;
              private TextView tTitle;
              class Ch { String n, u, g; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  player = new ExoPlayer.Builder(this).build();
                  ((PlayerView)findViewById(R.id.pv)).setPlayer(player);
                  rvG = findViewById(R.id.rv_g); rvI = findViewById(R.id.rv_i);
                  tTitle = findViewById(R.id.t_title);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  rvI.setLayoutManager(new LinearLayoutManager(this));

                  loadData();
                  findViewById(R.id.btn_refresh).setOnClickListener(v -> loadData());
                  findViewById(R.id.btn_fav).setOnClickListener(v -> rvI.setAdapter(new ItemAdapter(favList)));
              }

              private void loadData() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> {
                      parse(res); 
                      rvG.setAdapter(new GAdapter(new ArrayList<>(liveMap.keySet())));
                  }, null));
              }

              private void parse(String text) {
                  liveMap.clear();
                  String[] lines = text.split("\n"); Ch cur = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          cur = new Ch(); cur.n = l.split(",")[1].trim();
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "General";
                      } else if (l.startsWith("http") && cur != null) {
                          cur.u = l.trim();
                          if (!liveMap.containsKey(cur.g)) liveMap.put(cur.g, new ArrayList<>());
                          liveMap.get(cur.g).add(cur); cur = null;
                      }
                  }
              }

              class GAdapter extends RecyclerView.Adapter<GAdapter.VH> {
                  List<String> d; GAdapter(List<String> d) { this.d = d; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) {
                      Button b = new Button(p.getContext()); b.setTextColor(-1); b.setBackgroundColor(0); b.setAllCaps(false); return new VH(b);
                  }
                  @Override public void onBindViewHolder(VH h, int i) {
                      String gn = d.get(i); h.b.setText(gn);
                      h.b.setOnClickListener(v -> rvI.setAdapter(new ItemAdapter(liveMap.get(gn))));
                  }
                  @Override public int getItemCount() { return d.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v) { super(v); b = (Button)v; } }
              }

              class ItemAdapter extends RecyclerView.Adapter<ItemAdapter.VH> {
                  List<Ch> items; ItemAdapter(List<Ch> i) { items = i; }
                  @Override public VH onCreateViewHolder(ViewGroup p, int t) {
                      TextView tv = new TextView(p.getContext()); tv.setPadding(25,25,25,25); tv.setTextColor(-1); return new VH(tv);
                  }
                  @Override public void onBindViewHolder(VH h, int i) {
                      Ch c = items.get(i); h.tv.setText(c.n);
                      h.tv.setOnClickListener(v -> {
                          tTitle.setText(c.n);
                          player.setMediaItem(MediaItem.fromUri(c.u)); player.prepare(); player.play();
                      });
                      h.tv.setOnLongClickListener(v -> {
                          if(!favList.contains(c)) { favList.add(c); Toast.makeText(MainActivity.this, "تم الحفظ", 0).show(); }
                          return true;
                      });
                  }
                  @Override public int getItemCount() { return items.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView tv; VH(View v) { super(v); tv = (TextView)v; } }
              }
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:label="Rabie Pro V25" android:icon="@android:drawable/btn_star_big_on"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_V25
        uses: actions/upload-artifact@v4
        with: { name: Rabie_TV_V25, path: app/build/outputs/apk/debug/*.apk }
