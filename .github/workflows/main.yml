name: Rabie_V15_Original_Final
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_V15_Real
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # ستايل بدون حواف (NoActionBar & Fullscreen)
          cat <<EOF > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.IboV15" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
          </resources>
          EOF

          # واجهة V15: 3 أعمدة
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="horizontal" android:background="#000000">
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_g" 
                  android:layout_width="220dp" android:layout_height="match_parent" android:background="#121212"/>
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_i" 
                  android:layout_width="280dp" android:layout_height="match_parent" android:background="#1A1A1A"/>
              <androidx.media3.ui.PlayerView android:id="@+id/pv" 
                  android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000"/>
          </LinearLayout>
          EOF

          # كود الجافا (تكبير المشغل عند الضغط)
          cat <<EOF > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private PlayerView pv;
              private View rvG, rvI;
              private Map<String, List<String[]>> data = new LinkedHashMap<>();

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  rvG = findViewById(R.id.rv_g); rvI = findViewById(R.id.rv_i); pv = findViewById(R.id.pv);
                  ((RecyclerView)rvG).setLayoutManager(new LinearLayoutManager(this));
                  ((RecyclerView)rvI).setLayoutManager(new LinearLayoutManager(this));
                  player = new ExoPlayer.Builder(this).build(); pv.setPlayer(player);

                  loadM3U();

                  // ميزة التكبير: ضغطة وحدة على المشغل تخفي/تظهر القوائم
                  pv.setOnClickListener(v -> {
                      if(rvG.getVisibility() == View.VISIBLE) {
                          rvG.setVisibility(View.GONE); rvI.setVisibility(View.GONE);
                      } else {
                          rvG.setVisibility(View.VISIBLE); rvI.setVisibility(View.VISIBLE);
                      }
                  });
              }

              private void loadM3U() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(url, res -> {
                      parse(res);
                      ((RecyclerView)rvG).setAdapter(new GAdapter(new ArrayList<>(data.keySet())));
                  }, null));
              }

              private void parse(String s) {
                  String[] lines = s.split("\n"); String name="", group="قنوات", link="";
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          name = l.split(",")[1].trim();
                          if(l.contains("group-title=\"")) group = l.split("group-title=\"")[1].split("\"")[0];
                      } else if (l.startsWith("http")) {
                          link = l.trim();
                          if(!data.containsKey(group)) data.put(group, new ArrayList<String[]>());
                          data.get(group).add(new String[]{name, link});
                      }
                  }
              }

              class GAdapter extends RecyclerView.Adapter<GAdapter.V> {
                  List<String> keys; GAdapter(List<String> k){keys=k;}
                  public V onCreateViewHolder(ViewGroup p, int t) { TextView tv = new TextView(p.getContext()); tv.setPadding(30,45,30,45); tv.setTextColor(-1); return new V(tv); }
                  public void onBindViewHolder(V h, int i) { h.t.setText(keys.get(i)); h.t.setOnClickListener(v -> ((RecyclerView)rvI).setAdapter(new IAdapter(data.get(keys.get(i))))); }
                  public int getItemCount() { return keys.size(); }
                  class V extends RecyclerView.ViewHolder { TextView t; V(View v){super(v); t=(TextView)v;} }
              }

              class IAdapter extends RecyclerView.Adapter<IAdapter.V> {
                  List<String[]> items; IAdapter(List<String[]> it){items=it;}
                  public V onCreateViewHolder(ViewGroup p, int t) { TextView tv = new TextView(p.getContext()); tv.setPadding(30,40,30,40); tv.setTextColor(-1); return new V(tv); }
                  public void onBindViewHolder(V h, int i) { h.t.setText(items.get(i)[0]); h.t.setOnClickListener(v -> {
                      player.setMediaItem(MediaItem.fromUri(items.get(i)[1])); player.prepare(); player.play();
                  }); }
                  public int getItemCount() { return items.size(); }
                  class V extends RecyclerView.ViewHolder { TextView t; V(View v){super(v); t=(TextView)v;} }
              }
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' version '8.2.2' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'com.android.volley:volley:1.2.1'
          }
          EOF
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.IboV15" android:usesCleartextTraffic="true"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload_V15_Final
        uses: actions/upload-artifact@v4
        with: { name: Rabie_V15_Real_Player, path: app/build/outputs/apk/debug/*.apk }
