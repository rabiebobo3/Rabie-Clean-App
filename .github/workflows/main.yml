name: Rabie_Pro_V45_Final_Fix
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Build_V45
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties .gradle
          echo "android.useAndroidX=true" > gradle.properties
          
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          mkdir -p app/src/main/java/com/rabie/iptv app/src/main/res/layout app/src/main/res/drawable app/src/main/res/xml

          # تحميل الأيقونة والبانر
          curl -L "https://h.top4top.io/p_37263yx3j0.png" -o app/src/main/res/drawable/app_icon.png
          curl -L "https://a.top4top.io/p_3726jb1sj0.png" -o app/src/main/res/drawable/tv_banner.png

          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0a0714" android:keepScreenOn="true">
              <LinearLayout android:id="@+id/main_ui_container" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="#000" android:gravity="center_vertical" android:padding="8dp">
                      <ImageView android:layout_width="40dp" android:layout_height="40dp" android:src="@drawable/app_icon" android:layout_marginRight="10dp"/>
                      <HorizontalScrollView android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1">
                          <LinearLayout android:layout_width="wrap_content" android:layout_height="match_parent" android:orientation="horizontal" android:gravity="center">
                              <Button android:id="@+id/tab_fav" android:layout_width="wrap_content" android:layout_height="38dp" android:text="⭐ المفضلة" android:textColor="#CCC" android:background="@drawable/tab_style" android:layout_margin="4dp"/>
                              <Button android:id="@+id/tab_series" android:layout_width="wrap_content" android:layout_height="38dp" android:text="المسلسلات" android:textColor="#CCC" android:background="@drawable/tab_style" android:layout_margin="4dp"/>
                              <Button android:id="@+id/tab_movie" android:layout_width="wrap_content" android:layout_height="38dp" android:text="الأفلام" android:textColor="#CCC" android:background="@drawable/tab_style" android:layout_margin="4dp"/>
                              <Button android:id="@+id/tab_live" android:layout_width="wrap_content" android:layout_height="38dp" android:text="القنوات" android:textColor="#CCC" android:background="@drawable/tab_style" android:layout_margin="4dp"/>
                          </LinearLayout>
                      </HorizontalScrollView>
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal">
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.45" android:orientation="vertical">
                          <FrameLayout android:layout_width="match_parent" android:layout_height="220dp">
                              <androidx.media3.ui.PlayerView android:id="@+id/small_player" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="false"/>
                              <ImageView android:layout_width="60dp" android:layout_height="30dp" android:src="@drawable/app_icon" android:layout_margin="10dp" android:alpha="0.7"/>
                              <ProgressBar android:id="@+id/loading_s" android:layout_width="45dp" android:layout_height="45dp" android:layout_gravity="center" android:visibility="gone" android:indeterminateTint="#ff9100"/>
                          </FrameLayout>
                          <TextView android:id="@+id/txt_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="10dp" android:textColor="#ff9100" android:textStyle="bold" android:gravity="center"/>
                          <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_groups" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#1c142e"/>
                      </LinearLayout>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/rv_items" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="0.55" android:background="#130d21" android:padding="4dp"/>
                  </LinearLayout>
              </LinearLayout>

              <FrameLayout android:id="@+id/full_container" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:background="#000">
                  <androidx.media3.ui.PlayerView android:id="@+id/full_player" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="false"/>
                  <ProgressBar android:id="@+id/loading_f" android:layout_width="60dp" android:layout_height="60dp" android:layout_gravity="center" android:visibility="gone" android:indeterminateTint="#ff9100"/>
              </FrameLayout>
          </RelativeLayout>
          EOF

          # تصميم المربعات (Grid) للأفلام والمسلسلات
          cat <<EOF > app/src/main/res/layout/item_grid.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="5dp" android:gravity="center" android:background="@drawable/focus_highlight" android:focusable="true">
              <ImageView android:id="@+id/img_logo" android:layout_width="match_parent" android:layout_height="110dp" android:scaleType="centerInside" android:background="#1A1A1A"/>
              <TextView android:id="@+id/txt_name" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#FFF" android:textSize="11sp" android:gravity="center" android:maxLines="2" android:padding="2dp"/>
          </LinearLayout>
          EOF

          cat <<EOF > app/src/main/res/drawable/tab_style.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_focused="true"><shape><solid android:color="#ff9100"/><corners android:radius="15dp"/></shape></item><item><shape><solid android:color="#1c142e"/><corners android:radius="15dp"/></shape></item></selector>
          EOF

          cat <<EOF > app/src/main/res/drawable/focus_highlight.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_focused="true"><shape><solid android:color="#33ff9100"/><stroke android:width="2dp" android:color="#ff9100"/></shape></item><item><shape><solid android:color="@android:color/transparent"/></shape></item></selector>
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android { namespace 'com.rabie.iptv'; compileSdk 34; defaultConfig { applicationId "com.rabie.iptv"; minSdk 21; targetSdk 34; versionCode 45; versionName "45.0" } }
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/rabie/iptv/MainActivity.java
          package com.rabie.iptv;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AlertDialog;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.*;
          import androidx.media3.ui.PlayerView;
          import androidx.recyclerview.widget.*;
          import com.android.volley.toolbox.*;
          import com.bumptech.glide.Glide;
          import com.google.gson.Gson;
          import com.google.gson.reflect.TypeToken;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private ExoPlayer player;
              private Map<String, List<Ch>> live = new LinkedHashMap<>(), movie = new LinkedHashMap<>();
              private Map<String, Map<String, List<Ch>>> series = new LinkedHashMap<>();
              private List<Ch> favs = new ArrayList<>();
              private RecyclerView rvG, rvI;
              private PlayerView smallPV, fullPV;
              private View fullCont;
              private ProgressBar ps, pf;
              private String mode = "live";

              static class Ch { String n, u, g, l; }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  player = new ExoPlayer.Builder(this).build();
                  smallPV = findViewById(R.id.small_player); fullPV = findViewById(R.id.full_player);
                  fullCont = findViewById(R.id.full_container); ps = findViewById(R.id.loading_s); pf = findViewById(R.id.loading_f);
                  rvG = findViewById(R.id.rv_groups); rvI = findViewById(R.id.rv_items);
                  rvG.setLayoutManager(new LinearLayoutManager(this));
                  smallPV.setPlayer(player);

                  player.addListener(new Player.Listener() {
                      public void onPlaybackStateChanged(int s) {
                          int v = (s == Player.STATE_BUFFERING) ? View.VISIBLE : View.GONE;
                          ps.setVisibility(v); pf.setVisibility(v);
                      }
                  });

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      public void handleOnBackPressed() {
                          if (fullCont.getVisibility() == View.VISIBLE) toggleFull(false);
                          else if (player.isPlaying()) toggleFull(true);
                          else showExit();
                      }
                  });

                  loadData();
                  findViewById(R.id.tab_live).setOnClickListener(v -> setMode("live"));
                  findViewById(R.id.tab_movie).setOnClickListener(v -> setMode("movie"));
                  findViewById(R.id.tab_series).setOnClickListener(v -> setMode("series"));
                  findViewById(R.id.tab_fav).setOnClickListener(v -> setMode("fav"));
              }

              private void showExit() {
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert).setTitle("خروج").setMessage("هل تريد الخروج؟").setPositiveButton("نعم", (d, w) -> { player.release(); finish(); }).setNegativeButton("إلغاء", null).show();
              }

              private void toggleFull(boolean f) {
                  fullCont.setVisibility(f ? View.VISIBLE : View.GONE);
                  if(f) { smallPV.setPlayer(null); fullPV.setPlayer(player); }
                  else { fullPV.setPlayer(null); smallPV.setPlayer(player); }
              }

              private void setMode(String m) {
                  mode = m;
                  if (m.equals("series") || m.equals("movie")) rvI.setLayoutManager(new GridLayoutManager(this, 3));
                  else rvI.setLayoutManager(new LinearLayoutManager(this));
                  
                  if (m.equals("fav")) {
                      rvG.setAdapter(new GroupAd(Arrays.asList("المفضلة"), null));
                      rvI.setAdapter(new ItemAd(favs));
                  } else if (m.equals("series")) {
                      rvG.setAdapter(new GroupAd(new ArrayList<>(series.keySet()), null));
                      if(!series.isEmpty()) loadSeasons(series.keySet().iterator().next());
                  } else {
                      Map<String, List<Ch>> d = m.equals("movie") ? movie : live;
                      rvG.setAdapter(new GroupAd(new ArrayList<>(d.keySet()), d));
                      if(!d.isEmpty()) rvI.setAdapter(new ItemAd(d.values().iterator().next()));
                  }
              }

              private void loadSeasons(String gn) {
                  List<Ch> items = new ArrayList<>();
                  for(String s : series.get(gn).keySet()) { Ch c = new Ch(); c.n = s; c.g = "SEASON"; c.u = gn; items.add(c); }
                  rvI.setAdapter(new ItemAd(items));
              }

              private void loadEpisodes(String gn, String sn) {
                  rvI.setAdapter(new ItemAd(series.get(gn).get(sn)));
              }

              class GroupAd extends RecyclerView.Adapter<GroupAd.VH> {
                  List<String> g; Map<String, List<Ch>> d;
                  GroupAd(List<String> g, Map<String, List<Ch>> d){this.g=g; this.d=d;}
                  public VH onCreateViewHolder(ViewGroup p, int t) { Button b = new Button(p.getContext()); b.setBackgroundResource(R.drawable.focus_highlight); b.setTextColor(-1); return new VH(b); }
                  public void onBindViewHolder(VH h, int i) { h.b.setText(g.get(i)); h.b.setOnClickListener(v -> { if(mode.equals("series")) loadSeasons(g.get(i)); else rvI.setAdapter(new ItemAd(d.get(g.get(i)))); }); }
                  public int getItemCount() { return g.size(); }
                  class VH extends RecyclerView.ViewHolder { Button b; VH(View v){super(v); b=(Button)v;} }
              }

              class ItemAd extends RecyclerView.Adapter<ItemAd.VH> {
                  List<Ch> d; ItemAd(List<Ch> d){this.d=d;}
                  public VH onCreateViewHolder(ViewGroup p, int t) { 
                      int l = (mode.equals("live") || mode.equals("fav")) ? android.R.layout.simple_list_item_1 : R.layout.item_grid;
                      return new VH(LayoutInflater.from(p.getContext()).inflate(l, p, false)); 
                  }
                  public void onBindViewHolder(VH h, int i) {
                      Ch c = d.get(i); h.t.setText(c.n);
                      if(h.img != null) Glide.with(h.itemView).load(c.l).into(h.img);
                      h.itemView.setOnClickListener(v -> {
                          if("SEASON".equals(c.g)) loadEpisodes(c.u, c.n);
                          else { player.setMediaItem(MediaItem.fromUri(c.u)); player.prepare(); player.play(); toggleFull(true); ((TextView)findViewById(R.id.txt_title)).setText(c.n); }
                      });
                      h.itemView.setOnLongClickListener(v -> { if(!favs.contains(c)) favs.add(c); Toast.makeText(MainActivity.this,"أضيفت للمفضلة",0).show(); return true; });
                  }
                  public int getItemCount() { return d.size(); }
                  class VH extends RecyclerView.ViewHolder { TextView t; ImageView img; VH(View v){super(v); t=v.findViewById(mode.equals("live")?android.R.id.text1:R.id.txt_name); img=v.findViewById(R.id.img_logo);} }
              }

              private void loadData() {
                  String url = "https://gist.githubusercontent.com/rabiebobo3/d498347610d7312b3e9be88093117620/raw/list.m3u";
                  Volley.newRequestQueue(this).add(new StringRequest(0, url, res -> { parse(res); setMode("live"); }, null));
              }

              private void parse(String t) {
                  String[] lines = t.split("\n"); Ch cur = null;
                  for (String l : lines) {
                      if (l.contains("#EXTINF:")) {
                          cur = new Ch(); cur.n = l.split(",").length > 1 ? l.split(",")[1].trim() : "Ch";
                          cur.g = l.contains("group-title=\"") ? l.split("group-title=\"")[1].split("\"")[0] : "Other";
                          cur.l = l.contains("tvg-logo=\"") ? l.split("tvg-logo=\"")[1].split("\"")[0] : "";
                      } else if (l.startsWith("http") && cur != null) {
                          cur.u = l.trim(); String gn = cur.g.toLowerCase();
                          if (gn.contains("series")) {
                              String sn = cur.n.split(" S\\d+")[0].trim();
                              String ss = cur.n.contains("S") ? "Season " + cur.n.split("S")[1].substring(0,1) : "Season 1";
                              if(!series.containsKey(sn)) series.put(sn, new LinkedHashMap<>());
                              if(!series.get(sn).containsKey(ss)) series.get(sn).put(ss, new ArrayList<>());
                              series.get(sn).get(ss).add(cur);
                          } else if (gn.contains("movie")) {
                              if(!movie.containsKey(cur.g)) movie.put(cur.g, new ArrayList<>());
                              movie.get(cur.g).add(cur);
                          } else {
                              if(!live.containsKey(cur.g)) live.put(cur.g, new ArrayList<>());
                              live.get(cur.g).add(cur);
                          }
                          cur = null;
                      }
                  }
              }
          }
          EOF

          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" android:label="Rabie Pro V45" android:icon="@drawable/app_icon" android:banner="@drawable/tv_banner"><activity android:name="com.rabie.iptv.MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: UI_V45_Final
        uses: actions/upload-artifact@v4
        with: { name: Rabie_Pro_V45_Fixed, path: app/build/outputs/apk/debug/*.apk }
